<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stage Hub - ค้นหาคอร์ดเพลง</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. แถบด้านบน (ล็อกลอยนิ่งแสดงท็อคแบคและเพลงถัดไป) -->
  <div class="search-top-bar">
    <div id="topTalkbackBox" class="top-box">
      <div class="top-head">
        <span class="top-title"><i class="tb-dot-red"></i>ท็อคแบคล่าสุด</span>
        <span id="topTalkbackSender" class="top-sender"></span>
      </div>
      <div id="topTalkbackText" class="top-content">สแตนบายรอคำสั่ง...</div>
    </div>
    <div id="topNextBox" class="top-box">
      <span class="top-title">เพลงถัดไป</span>
      <div id="topNextText" class="top-content">-</div>
    </div>
  </div>

  <!-- 2. ส่วนแสดงผลคิวเพลงตรงกลาง (เลื่อนดูรายชื่อได้อิสระ) -->
  <div class="search-main-content" id="searchQueueContainer">
    <div class="u-empty">กำลังโหลดคิวเพลงแบบ Realtime...</div>
  </div>

  <!-- 3. ช่องค้นหา (ย้ายมาลอยนิ่งติดขอบล่างเหนือแถบนำทาง) -->
  <div class="search-input-section">
    <div class="search-input-group">
      <input type="text" id="chordSearchInput" class="search-text-input" placeholder="แตะเพลงจากคิว หรือพิมพ์ชื่อ">
      <button class="search-btn-submit" onclick="searchChordOnGoogle()"><svg class="ic ic-solo" aria-hidden="true"><use href="#i-search"/></svg></button>
    </div>
  </div>

  <script>
    window.initSearchPageModule = function() {
      let currentQueueList = [];

      // ค่าตั้งค่าการค้นหารายบุคคล: users/{ชื่อผู้ใช้}/searchPrefs (ตั้งในหน้าตั้งค่า)
      let searchPrefs = { suffix: 'คอร์ด', includeArtist: true, copy: true, copyMode: 'title', copySuffix: false };
      try {
        const __u = (JSON.parse(localStorage.getItem('lsh_session') || '{}')).username;
        if (__u) db.ref('users/' + __u + '/searchPrefs').once('value').then(sn => {
          if (sn.val()) searchPrefs = Object.assign(searchPrefs, sn.val());
        }).catch(() => {});
      } catch (e) {}
      function copyToClipboard(text) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
          }
        } catch (e) {}
        return new Promise((res, rej) => {
          try {
            const t = document.createElement('textarea');
            t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
            document.body.appendChild(t); t.select();
            const ok = document.execCommand('copy'); t.remove();
            ok ? res() : rej();
          } catch (e) { rej(e); }
        });
      }

      function initSearchQueueListener() {
        const sessionStr = localStorage.getItem('lsh_session');
        const session = sessionStr ? JSON.parse(sessionStr) : {};
        const selectedRoom = lshRoom(session);
        if (!selectedRoom) return; // ไม่พบห้อง: ไม่เขียน/อ่านข้อมูลใดๆ และกลับไปหน้าเลือกห้อง

        if (typeof db !== 'undefined' && db && db.ref) {
          db.ref(`rooms/${selectedRoom}/queue/songs`).off('value');
          db.ref(`rooms/${selectedRoom}/queue/songs`).on('value', (snapshot) => {
            window.lshReady && window.lshReady();
            const val = snapshot.val();
            if (val && Array.isArray(val)) {
              currentQueueList = val;
              renderSearchQueue(val);
            } else {
              let localQueue = JSON.parse(localStorage.getItem('lsh_queue_data')) || [];
              currentQueueList = localQueue;
              renderSearchQueue(localQueue);
            }
          });
        } else {
          let localQueue = JSON.parse(localStorage.getItem('lsh_queue_data')) || [];
          currentQueueList = localQueue;
          renderSearchQueue(localQueue);
        }

        loadLatestTalkback(selectedRoom);
      }

      function loadLatestTalkback(room) {
        if (typeof db !== 'undefined' && db && db.ref) {
          lshBindTopTalkback(room, document.getElementById('topTalkbackText'), document.getElementById('topTalkbackSender'));
        }
      }

      function renderSearchQueue(queueData) {
        const container = document.getElementById('searchQueueContainer');
        const topNextText = document.getElementById('topNextText');
        if (!container) return;

        if (!queueData || queueData.length === 0) {
          container.innerHTML = '<div class="u-empty">ยังไม่มีข้อมูลคิวเพลงในขณะนี้</div>';
          if (topNextText) topNextText.innerText = '-';
          const tnb0 = document.getElementById('topNextBox'); if (tnb0) tnb0.className = 'top-box';
          return;
        }

        let html = '<div class="sq-hint">แตะเพลงจากคิวเพื่อค้นหาคอร์ด</div>';
        let nextSongObj = queueData.find(i => i.status === 'next');
        if (topNextText) {
          topNextText.innerText = nextSongObj ? ((nextSongObj.type === 'dummy_start' || nextSongObj.type === 'dummy_end') ? lshPlain(nextSongObj.title) : `${nextSongObj.title}`) : 'จบการแสดง';
        }
        const tnb = document.getElementById('topNextBox');
        if (tnb) tnb.className = 'top-box' + (nextSongObj && nextSongObj.set ? ' set-color-' + nextSongObj.set.replace('Set ', '') : '');
        lshWatch(topNextText, 'next');

        queueData.forEach((song) => {
          if (song.status === 'played' || song.status === 'playing' || song.status === 'removed') return; // ตามบอร์ดดีไซน์: แสดงเฉพาะเพลงถัดไปและที่เหลือ | เพลงที่ลบออกจากคิวแล้ว ไม่แสดงในหน้าค้นหา
          if (song.type === 'dummy_start' || song.type === 'dummy_end') {
            return; // ตามบอร์ดดีไซน์: หน้าค้นหาไม่แสดงการ์ดเริ่ม/จบการแสดง
            let stateLabel = '';
            let style = '';
            if (song.status === 'playing') {
              stateLabel = ' (กำลังสแตนบายหน้าเวที)';
              style = 'border: 2px solid #00f2d1; color: #00f2d1; background: #1a3a3a;';
            } else if (song.status === 'played') {
              style = 'opacity: 0.4; text-decoration: line-through;';
            }
            html += `<div class="special-card" style="${style}">${lshIcon(song.type === 'dummy_start' ? 'dot' : 'flag')} ${lshPlain(song.title)}${stateLabel}</div>`;
            return;
          }

          let setVal = song.set || 'Set 1';
          let setNum = setVal.replace('Set ', '');
          let setColorClass = `set-color-${setNum}`;
          let customClass = '';
          if (song.type === 'inserted-request') customClass = 'inserted-request';
          if (song.type === 'inserted-custom') customClass = 'inserted-custom';

          let statusBadge = '<span class="badge-status badge-normal">รอเล่น</span>';
          if (song.status === 'played') {
            statusBadge = '<span class="badge-status badge-played">เล่นแล้ว</span>';
            customClass += ' played';
          } else if (song.status === 'playing') {
            statusBadge = '<span class="badge-status badge-playing">กำลังเล่น</span>';
          } else if (song.status === 'next') {
            statusBadge = '<span class="badge-status badge-next">เพลงถัดไป</span>';
            customClass += ' next-song';
          }

          let cardHtml = `
            <div class="song-card ${setColorClass} ${customClass}" id="card_${song.id}" onclick="selectSongForSearch('${encodeURIComponent(song.title)}', '${encodeURIComponent(song.artist)}')">
              <div class="u-flex1 q-body">
                ${song.status === 'next' ? '<div class="q-tag">ถัดไป</div>' : ''}
                ${song.status === 'playing' ? '<div class="q-playing" style="margin-bottom:2px"><i></i>กำลังเล่น</div>' : ''}
                <div class="song-title-main">${song.title}</div>
                <div class="q-artist">${song.artist || ''}${/^Set \d+$/.test(setVal) ? '' : `<span class="set-pill">${setVal}</span>`}</div>
              </div>
              <svg class="ic q-go" aria-hidden="true"><use href="#i-search"/></svg>
            </div>
          `;
          html += cardHtml;
        });

        container.innerHTML = html;

        setTimeout(() => {
          let targetEl = container.querySelector('.next-song') || container.querySelector('.badge-playing')?.closest('.song-card');
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 100);
      }

      window.selectSongForSearch = function(encodedTitle, encodedArtist) {
        let title = decodeURIComponent(encodedTitle);
        let artist = decodeURIComponent(encodedArtist);
        let inputEl = document.getElementById('chordSearchInput');
        if (inputEl) {
          // ไม่สั่งโฟกัส: ไม่เปิดคีย์บอร์ดโดยไม่ตั้งใจ
          inputEl.value = (searchPrefs.includeArtist === false || !artist) ? title : `${title} ${artist}`;
        }
        if (searchPrefs.copy !== false) {
          let text = (searchPrefs.copyMode === 'both' && artist) ? `${title} ${artist}` : title;
          if (searchPrefs.copySuffix === true && searchPrefs.suffix) text = `${text} ${searchPrefs.suffix}`;
          copyToClipboard(text)
            .then(() => lshToast('คัดลอก “' + text + '” แล้ว', 'ok'))
            .catch(() => lshToast('คัดลอกอัตโนมัติไม่ได้ในเครื่องนี้', 'warn'));
        }
      };

      window.searchChordOnGoogle = function() {
        let inputEl = document.getElementById('chordSearchInput');
        if (!inputEl) return;
        let keyword = inputEl.value.trim();
        if (!keyword) {
          lshAlert('กรุณาพิมพ์หรือเลือกชื่อเพลงก่อนค้นหาครับ');
          return;
        }
        let searchQuery = searchPrefs.suffix === undefined ? keyword + ' คอร์ด' : (keyword + ' ' + searchPrefs.suffix).trim();
        let googleUrl = `https://www.google.com/search?q=${encodeURIComponent(searchQuery)}`;
        window.open(googleUrl, '_blank');
      };

      initSearchQueueListener();
    };

    window.initSearchPageModule();
  </script>
</body>
</html>
