<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stage Hub - ค้นหาคอร์ดเพลง</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. แถบด้านบน (ล็อกลอยนิ่งแสดงท็อคแบคและเพลงถัดไป) -->
  <div class="search-top-bar">
    <div id="topTalkbackBox" class="top-box">
      <div class="top-head">
        <span class="top-title"><i class="tb-dot-red"></i>ท็อคแบคล่าสุด</span>
        <span id="topTalkbackSender" class="top-sender"></span>
      </div>
      <div id="topTalkbackText" class="top-content">สแตนบายรอคำสั่ง...</div>
    </div>
    <div id="topNextBox" class="top-box">
      <span class="top-title">เพลงถัดไป</span>
      <div id="topNextText" class="top-content">-</div>
    </div>
  </div>

  <!-- 2. ส่วนแสดงผลคิวเพลงตรงกลาง (เลื่อนดูรายชื่อได้อิสระ) -->
  <div class="search-main-content" id="searchQueueContainer">
    <div class="u-empty">กำลังโหลดคิวเพลงแบบ Realtime...</div>
  </div>

  <!-- 3. ช่องค้นหา (ย้ายมาลอยนิ่งติดขอบล่างเหนือแถบนำทาง) -->
  <div class="search-input-section">
    <div class="search-input-group">
      <input type="text" id="chordSearchInput" class="search-text-input" placeholder="แตะเพลงจากคิว หรือพิมพ์ชื่อ">
      <button class="search-btn-submit" onclick="searchChordOnGoogle()"><svg class="ic ic-solo" aria-hidden="true"><use href="#i-search"/></svg></button>
    </div>
  </div>

  <script>
    window.initSearchPageModule = function() {
      let currentQueueList = [];

      // ===== การ์ดขยายดูเนื้อ+คอร์ดเต็มจอ (แตะแว่นขยายสีเขียวบนการ์ด) =====
      // คำขอจากหน้ามอนิเตอร์: window.__lshExpandReq = {qid, mode:'expand'|'none'} (อ่านครั้งเดียวตอนเข้าหน้านี้)
      const qx = { openId: null, docs: {}, fs: 20, lyr: false, cols2: false, req: window.__lshExpandReq || null, showPlayed: false, autoFor: null, autoOpened: null, autoTry: 0, noteFor: null };
      window.__lshExpandReq = null;
      try { qx.fs = parseInt(localStorage.getItem('lsh_chord_fs'), 10) || 20; qx.lyr = localStorage.getItem('lsh_chord_lyr') === '1'; qx.cols2 = localStorage.getItem('lsh_chord_cols') === '2'; } catch (e) {}
      const qxSave = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
      const NO_CHORD_TXT = 'เพลงนี้ยังไม่มีคอร์ดในฐานข้อมูล';

      // ค่าตั้งค่าการค้นหารายบุคคล: users/{ชื่อผู้ใช้}/searchPrefs (ตั้งในหน้าตั้งค่า)
      let searchPrefs = { suffix: 'คอร์ด', includeArtist: true, copy: true, copyMode: 'title', copySuffix: false };
      try {
        const __u = (JSON.parse(localStorage.getItem('lsh_session') || '{}')).username;
        if (__u) db.ref('users/' + __u + '/searchPrefs').once('value').then(sn => {
          if (sn.val()) searchPrefs = Object.assign(searchPrefs, sn.val());
        }).catch(() => {});
      } catch (e) {}
      function copyToClipboard(text) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
          }
        } catch (e) {}
        return new Promise((res, rej) => {
          try {
            const t = document.createElement('textarea');
            t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
            document.body.appendChild(t); t.select();
            const ok = document.execCommand('copy'); t.remove();
            ok ? res() : rej();
          } catch (e) { rej(e); }
        });
      }

      function initSearchQueueListener() {
        const sessionStr = localStorage.getItem('lsh_session');
        const session = sessionStr ? JSON.parse(sessionStr) : {};
        const selectedRoom = lshRoom(session);
        if (!selectedRoom) return; // ไม่พบห้อง: ไม่เขียน/อ่านข้อมูลใดๆ และกลับไปหน้าเลือกห้อง

        if (typeof db !== 'undefined' && db && db.ref) {
          db.ref(`rooms/${selectedRoom}/queue/songs`).off('value');
          db.ref(`rooms/${selectedRoom}/queue/songs`).on('value', (snapshot) => {
            window.lshReady && window.lshReady();
            const val = snapshot.val();
            if (val && Array.isArray(val)) {
              currentQueueList = val;
              renderSearchQueue(val);
            } else {
              let localQueue = JSON.parse(localStorage.getItem('lsh_queue_data')) || [];
              currentQueueList = localQueue;
              renderSearchQueue(localQueue);
            }
          });
        } else {
          let localQueue = JSON.parse(localStorage.getItem('lsh_queue_data')) || [];
          currentQueueList = localQueue;
          renderSearchQueue(localQueue);
        }

        loadLatestTalkback(selectedRoom);
      }

      function loadLatestTalkback(room) {
        if (typeof db !== 'undefined' && db && db.ref) {
          lshBindTopTalkback(room, document.getElementById('topTalkbackText'), document.getElementById('topTalkbackSender'));
        }
      }

      function renderSearchQueue(queueData) {
        const container = document.getElementById('searchQueueContainer');
        const topNextText = document.getElementById('topNextText');
        if (!container) return;

        if (!queueData || queueData.length === 0) {
          container.innerHTML = '<div class="u-empty">ยังไม่มีข้อมูลคิวเพลงในขณะนี้</div>';
          if (topNextText) topNextText.innerText = '-';
          const tnb0 = document.getElementById('topNextBox'); if (tnb0) tnb0.className = 'top-box';
          return;
        }

        let html = '<div class="sq-hint">แตะเพลงจากคิวเพื่อค้นหาคอร์ด</div>';
        const playedN = queueData.filter(x => x && x.status === 'played' && x.type !== 'dummy_start' && x.type !== 'dummy_end').length;
        if (playedN) html += '<button type="button" id="sqPlayedToggle" class="sq-played' + (qx.showPlayed ? ' open' : '') + '" onclick="toggleSqPlayed()">เล่นแล้ว ' + playedN + ' เพลง <span>' + (qx.showPlayed ? 'ซ่อน ▴' : 'แสดง ▾') + '</span></button>';
        let nextSongObj = queueData.find(i => i.status === 'next');
        if (topNextText) {
          topNextText.innerText = nextSongObj ? ((nextSongObj.type === 'dummy_start' || nextSongObj.type === 'dummy_end') ? lshPlain(nextSongObj.title) : `${nextSongObj.title}`) : 'จบการแสดง';
        }
        const tnb = document.getElementById('topNextBox');
        if (tnb) tnb.className = 'top-box' + (nextSongObj && nextSongObj.set ? ' set-color-' + nextSongObj.set.replace('Set ', '') : '');
        lshWatch(topNextText, 'next');

        let prevNormalSet = null; // เส้นคั่นเซ็ต: คำนวณตอนวาดจากเพลงที่แสดงอยู่ ไม่บันทึกลงข้อมูล
        queueData.forEach((song) => {
          const isReqCard = !!(qx.req && String(song.id) === String(qx.req.qid)); // เพลงที่กำลังเล่นแสดงเฉพาะเมื่อถูกเปิดมาจากหน้ามอนิเตอร์
          if (song.status === 'removed' || (song.status === 'played' && !qx.showPlayed && !isReqCard)) return; // เพลงที่เล่นแล้วพับไว้ในแถว "เล่นแล้ว N เพลง" (แตะเพื่อแสดง) เพลงที่กำลังเล่นแสดงเสมอ เพลงที่ลบออกจากคิวแล้ว ไม่แสดงในหน้าค้นหา
          if (song.type === 'dummy_start' || song.type === 'dummy_end') {
            return; // ตามบอร์ดดีไซน์: หน้าค้นหาไม่แสดงการ์ดเริ่ม/จบการแสดง
            let stateLabel = '';
            let style = '';
            if (song.status === 'playing') {
              stateLabel = ' (กำลังสแตนบายหน้าเวที)';
              style = 'border: 2px solid #00f2d1; color: #00f2d1; background: #1a3a3a;';
            } else if (song.status === 'played') {
              style = 'opacity: 0.4; text-decoration: line-through;';
            }
            html += `<div class="special-card" style="${style}">${lshIcon(song.type === 'dummy_start' ? 'dot' : 'flag')} ${lshPlain(song.title)}${stateLabel}</div>`;
            return;
          }

          let setVal = song.set || 'Set 1';
          let setNum = setVal.replace('Set ', '');
          let setColorClass = `set-color-${setNum}`;
          if (song.type !== 'inserted-custom' && song.type !== 'inserted-request' && /^Set \d+$/.test(setVal)) {
            if (prevNormalSet !== null && prevNormalSet !== setVal) html += `<div class="set-divider sd-${setNum}"><span>${setVal.toUpperCase()}</span></div>`;
            prevNormalSet = setVal;
          }
          let customClass = '';
          if (song.type === 'inserted-request') customClass = 'inserted-request';
          if (song.type === 'inserted-custom') customClass = 'inserted-custom';

          let statusBadge = '<span class="badge-status badge-normal">รอเล่น</span>';
          if (song.status === 'played') {
            statusBadge = '<span class="badge-status badge-played">เล่นแล้ว</span>';
            customClass += ' played';
          } else if (song.status === 'playing') {
            statusBadge = '<span class="badge-status badge-playing">กำลังเล่น</span>';
          } else if (song.status === 'next') {
            statusBadge = '<span class="badge-status badge-next">เพลงถัดไป</span>';
            customClass += ' next-song';
          }

          let cardHtml = `
            <div class="song-card ${setColorClass} ${customClass}" id="card_${song.id}" onclick="selectSongForSearch('${encodeURIComponent(song.title)}', '${encodeURIComponent(song.artist)}')">
              <div class="u-flex1 q-body">
                ${song.status === 'next' ? '<div class="q-tag">ถัดไป</div>' : ''}
                ${song.status === 'playing' ? '<div class="q-playing" style="margin-bottom:2px"><i></i>กำลังเล่น</div>' : ''}
                <div class="song-title-main">${song.title}</div>
                <div class="q-artist">${(Array.isArray(song.parts) && song.parts.length) ? song.parts.map(pt => pt.title).join(' · ') : (song.artist || '')}${/^Set \d+$/.test(setVal) ? '' : `<span class="set-pill">${setVal}</span>`}</div>
              </div>
              <svg class="ic q-go ${(Array.isArray(song.parts) && song.parts.length) ? 'has-chord' : (window.lshChordCls && song.songId ? window.lshChordCls(song.songId) : '')}" data-chordid="${song.songId || ''}" ${(Array.isArray(song.parts) && song.parts.length) ? 'data-medley="1"' : ''} aria-hidden="true"><use href="#i-search"/></svg>
              ${(isReqCard && qx.req.mode === 'none') || (song.status === 'playing' && qx.noteFor === String(song.id)) ? '<div class="qx-none">' + NO_CHORD_TXT + '</div>' : ''}
            </div>
          `;
          html += cardHtml;
        });

        const scr0 = qxScroller(), top0 = scr0 ? scr0.scrollTop : 0;
        container.innerHTML = html;
        if (qx.openId) {
          if (document.getElementById('card_' + qx.openId)) { qxOpen(qx.openId, true); if (scr0) scr0.scrollTop = top0; }
          else qx.openId = null;
        }
        if (qx.req && !qx.req.done && queueData.some(x => String(x.id) === String(qx.req.qid))) {
          qx.req.done = true;
          if (qx.req.mode === 'expand') qxOpen(qx.req.qid);
        }

        qxAuto();   // เพลงที่กำลังเล่น: กางคอร์ดให้อัตโนมัติ (ครั้งแรกที่เจอเพลงนั้น)

        setTimeout(() => {
          if (qx.openId) return;
          const reqEl = qx.req && document.getElementById('card_' + qx.req.qid);
          let targetEl = reqEl || container.querySelector('.badge-playing')?.closest('.song-card') || container.querySelector('.next-song');
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 100);
      }

      window.toggleSqPlayed = function() { qx.showPlayed = !qx.showPlayed; renderSearchQueue(currentQueueList); };

      // กางคอร์ดเพลงที่กำลังเล่นอัตโนมัติ: ทำครั้งเดียวต่อเพลง และไม่แย่งถ้าผู้ใช้กางการ์ดเพลงอื่นอยู่
      function qxAuto() {
        const pl = currentQueueList.find(i => i && i.status === 'playing' && i.type !== 'dummy_start' && i.type !== 'dummy_end');
        if (!pl) return;
        const id = String(pl.id);
        if (qx.autoFor === id || !document.getElementById('card_' + id)) return;
        const has = (Array.isArray(pl.parts) && pl.parts.length > 0) || (window.lshChordCls && pl.songId && window.lshChordCls(pl.songId) === 'has-chord');
        if (!has) {
          // เครื่องหมายคอร์ดอาจยังโหลดไม่เสร็จ: ลองใหม่ไม่กี่ครั้ง ถ้ายังไม่มีจริงๆ แสดงข้อความว่าไม่มีคอร์ด
          if (qx.autoTry < 4) { qx.autoTry++; setTimeout(qxAuto, 700); return; }
          qx.autoFor = id; qx.autoTry = 0; qx.noteFor = id; renderSearchQueue(currentQueueList); return;
        }
        qx.autoFor = id; qx.autoTry = 0; qx.noteFor = null;
        const prev = qx.autoOpened;
        if (!qx.openId || qx.openId === prev || !document.getElementById('card_' + qx.openId)) { qxOpen(id); qx.autoOpened = id; }
      }

      function qxScroller() {
        let el = document.getElementById('searchQueueContainer');
        while (el && el !== document.body) { const o = getComputedStyle(el).overflowY; if ((o === 'auto' || o === 'scroll') && el.scrollHeight > el.clientHeight + 1) return el; el = el.parentElement; }
        return document.scrollingElement || document.documentElement;
      }
      const qxItem = (id) => currentQueueList.find(i => i && String(i.id) === String(id));
      function qxClose() {
        qx.openId = null;
        document.querySelectorAll('#searchQueueContainer .q-exp').forEach(n => n.remove());
        document.querySelectorAll('#searchQueueContainer .song-card.q-open').forEach(n => { n.classList.remove('q-open'); n.style.minHeight = ''; });
      }
      // เลขลำดับเพลงในคิว (ตรงกับหน้าคิว) ใช้ทำแถบคั่น "8.2 ชื่อเพลง"
      function qxNo(item) {
        let n = 0;
        for (const i of currentQueueList) { if (!i || i.type === 'dummy_start' || i.type === 'dummy_end' || i.status === 'removed') continue; n++; if (String(i.id) === String(item.id)) return n; }
        return 0;
      }
      function qxFill(box, item) {
        const st = box.querySelector('.qx-status'), body = box.querySelector('.qx-body'), keyEl = box.querySelector('.qx-key');
        const X = window.lshChords && window.lshChords._x;
        const none = () => { st.textContent = NO_CHORD_TXT; st.classList.add('grey'); body.innerHTML = ''; };
        const med = Array.isArray(item.parts) && item.parts.length > 0;   // เมดเลย์: ต่อคอร์ดของเพลงย่อยเป็นหน้าเดียว มีแถบคั่นเพลง
        if ((!item.songId && !med) || !X) { none(); return; }
        const ck = med ? 'med:' + item.id + ':' + JSON.stringify(item.parts) : item.songId;
        let p = qx.docs[ck];
        if (!p) { p = qx.docs[ck] = med ? X.getMedleyDoc(item.parts, qxNo(item)) : X.getDoc(item.songId); p.catch(() => { delete qx.docs[ck]; }); }
        p.then(d => {
          if (String(qx.openId) !== String(item.id) || !box.isConnected) return;
          const a = d.at(item.key);
          body.innerHTML = X.sectionsHtml(d.rec.s, a.n, a.flat);
          st.textContent = ''; if (keyEl) keyEl.textContent = 'คีย์ ' + a.keyLabel;
        }).catch(e => {
          if (String(qx.openId) !== String(item.id) || !box.isConnected) return;
          if (e && e.message === 'notfound') none(); else { st.textContent = 'โหลดคอร์ดไม่ได้ (ตรวจสอบอินเทอร์เน็ต แล้วลองใหม่)'; st.classList.add('grey'); }
        });
      }
      function qxOpen(qid, keep) {
        const item = qxItem(qid), card = document.getElementById('card_' + qid);
        if (!item || !card) return;
        if (!keep) qxClose();
        qx.openId = String(qid);
        card.classList.add('q-open');
        const set = /^Set \d+$/.test(item.set || '') ? String(item.set).toUpperCase() : (item.set || '');
        const box = document.createElement('div');
        box.className = 'q-exp qx' + (qx.lyr ? ' lyr' : '') + (qx.cols2 ? ' cols2' : '');
        box.onclick = (e) => e.stopPropagation();
        box.innerHTML = '<div class="qx-bar"><div class="qx-row">' +
          '<div class="qx-seg" data-k="cols"><button type="button" data-v="1" aria-label="1 คอลัมน์" title="1 คอลัมน์" class="' + (qx.cols2 ? '' : 'on') + '"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h5"/></svg></button><button type="button" data-v="2" aria-label="2 คอลัมน์" title="2 คอลัมน์" class="' + (qx.cols2 ? 'on' : '') + '"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3.5" width="8.2" height="17" rx="2"/><rect x="12.8" y="3.5" width="8.2" height="17" rx="2"/><path d="M5.3 8h3.6M5.3 12h3.6M15.1 8h3.6M15.1 12h3.6"/></svg></button></div>' +
          '<div class="qx-seg" data-k="mode"><button type="button" data-v="c" aria-label="คอร์ด+เนื้อ" title="คอร์ด+เนื้อ" class="' + (qx.lyr ? '' : 'on') + '"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5h3M12 4.5h3" stroke-width="2.4"/><path d="M4 10h16M4 15h16M4 20h10"/></svg></button><button type="button" data-v="l" aria-label="เนื้ออย่างเดียว" title="เนื้ออย่างเดียว" class="' + (qx.lyr ? 'on' : '') + '"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h11"/></svg></button></div>' +
          '<div class="qx-seg" data-k="fs"><button type="button" data-v="-">A−</button><button type="button" data-v="+">A+</button></div>' +
          '<span class="qx-chip">' + set + ((Array.isArray(item.parts) && item.parts.length) ? '' : (set ? ' · ' : '') + '<b class="qx-key">' + (item.key && item.key !== '-' ? 'คีย์ ' + item.key : 'คีย์ -') + '</b>') + '</span>' +
          '</div></div>' +
          '<div class="qx-status">กำลังโหลดคอร์ด…</div><div class="ch-body qx-body"></div>';
        card.appendChild(box);
        const tb = document.querySelector('.search-top-bar'), inp = document.querySelector('.search-input-section'), scr = qxScroller();
        const vh = scr === document.scrollingElement || scr === document.documentElement ? window.innerHeight : scr.clientHeight;
        card.style.minHeight = Math.max(320, vh - (tb ? tb.offsetHeight : 0) - (inp ? inp.offsetHeight : 0) - 70) + 'px';
        const stickTop = (tb && scr.contains(tb)) ? tb.offsetHeight : 0; // แถบบนติดอยู่ในตัวเลื่อนเดียวกันหรือไม่ (ตัวเลื่อนจริงของแอป = ใช่)
        box.querySelector('.qx-bar').style.top = stickTop + 'px';
        const body = box.querySelector('.qx-body'); body.style.fontSize = qx.fs + 'px';
        const mark = (g, v) => g.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
        box.querySelectorAll('.qx-seg').forEach(g => g.onclick = (e) => {
          const b = e.target.closest('button'); if (!b) return; const k = g.dataset.k, v = b.dataset.v;
          if (k === 'cols') { qx.cols2 = v === '2'; qxSave('lsh_chord_cols', qx.cols2 ? '2' : '1'); box.classList.toggle('cols2', qx.cols2); mark(g, v); }
          else if (k === 'mode') { qx.lyr = v === 'l'; qxSave('lsh_chord_lyr', qx.lyr ? '1' : '0'); box.classList.toggle('lyr', qx.lyr); mark(g, v); }
          else { qx.fs = Math.max(12, Math.min(44, qx.fs + (v === '+' ? 2 : -2))); qxSave('lsh_chord_fs', qx.fs); body.style.fontSize = qx.fs + 'px'; }
        });
        // แตะสั้นๆ ที่ตัวเนื้อเพลง = ย่อการ์ด (ไม่ย่อถ้ากำลังเลือกข้อความ / เลื่อนหน้า ซึ่งไม่นับเป็นการแตะ)
        body.addEventListener('click', () => { const sel = window.getSelection && window.getSelection(); if (sel && String(sel).length) return; qxClose(); });
        qxFill(box, item);
        if (!keep) setTimeout(() => { const r = card.getBoundingClientRect(), sr = (scr === document.scrollingElement || scr === document.documentElement) ? 0 : scr.getBoundingClientRect().top; scr.scrollTop += r.top - sr - stickTop - 8; }, 30);
      }
      (function bindQx() {
        const c = document.getElementById('searchQueueContainer'); if (!c) return;
        c.addEventListener('click', (e) => {
          const g = e.target.closest && e.target.closest('.q-go.has-chord'); if (!g) return;
          const card = g.closest('.song-card'); if (!card) return;
          e.stopPropagation(); e.preventDefault();
          const qid = card.id.replace(/^card_/, '');
          if (qx.openId === qid) qxClose(); else qxOpen(qid);
        }, true);
      })();

      window.selectSongForSearch = function(encodedTitle, encodedArtist) {
        let title = decodeURIComponent(encodedTitle);
        let artist = decodeURIComponent(encodedArtist);
        let inputEl = document.getElementById('chordSearchInput');
        if (inputEl) {
          // ไม่สั่งโฟกัส: ไม่เปิดคีย์บอร์ดโดยไม่ตั้งใจ
          inputEl.value = (searchPrefs.includeArtist === false || !artist) ? title : `${title} ${artist}`;
        }
        if (searchPrefs.copy !== false) {
          let text = (searchPrefs.copyMode === 'both' && artist) ? `${title} ${artist}` : title;
          if (searchPrefs.copySuffix === true && searchPrefs.suffix) text = `${text} ${searchPrefs.suffix}`;
          copyToClipboard(text)
            .then(() => lshToast('คัดลอก “' + text + '” แล้ว', 'ok'))
            .catch(() => lshToast('คัดลอกอัตโนมัติไม่ได้ในเครื่องนี้', 'warn'));
        }
      };

      window.searchChordOnGoogle = function() {
        let inputEl = document.getElementById('chordSearchInput');
        if (!inputEl) return;
        let keyword = inputEl.value.trim();
        if (!keyword) {
          lshAlert('กรุณาพิมพ์หรือเลือกชื่อเพลงก่อนค้นหาครับ');
          return;
        }
        let searchQuery = searchPrefs.suffix === undefined ? keyword + ' คอร์ด' : (keyword + ' ' + searchPrefs.suffix).trim();
        let googleUrl = `https://www.google.com/search?q=${encodeURIComponent(searchQuery)}`;
        window.open(googleUrl, '_blank');
      };

      initSearchQueueListener();
    };

    window.initSearchPageModule();
  </script>
</body>
</html>
