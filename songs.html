<!-- ========================================== -->
<!-- หน้าเบื้องหลัง: เพลงทั้งหมด (songs.html)         -->
<!-- ========================================== -->
<link rel="stylesheet" href="style.css">
<div class="songs-container">

  <!-- 📌 แถบควบคุมด้านบน (Sticky Header) -->
  <div class="sticky-header-wrap">
    <!-- บรรทัดที่ 1: ช่องค้นหา + ปุ่มสามเหลี่ยมสลับฟิลเตอร์ + ปุ่มเพิ่มเพลง -->
    <div class="header-line-1">
      <div class="search-box-wrap">
        <input type="text" id="songSearchInput" class="search-input" placeholder="พิมพ์ชื่อเพลง หรือชื่อศิลปิน...">
      </div>
      <button id="btnToggleLine2" class="toggle-filter-btn" title="แสดง/ซ่อน ตัวกรอง"><svg class="ic ic-solo" aria-hidden="true"><use href="#i-chev-down"/></svg></button>
      <button id="btnOpenAddSong" class="add-song-btn">+ เพิ่มเพลง</button>
    </div>

    <!-- บรรทัดที่ 2: ฟิลเตอร์คีย์ + จัดเรียงโดย -->
    <div id="headerLine2" class="header-line-2 collapsed">
      <label style="font-size:12px;color:var(--c-aaaaaa);display:flex;align-items:center;gap:6px">
        คีย์:
        <select id="keyFilterSelect" class="sort-select" style="border-color:var(--c-00f2d1);font-weight:bold;color:var(--c-00f2d1)">
          <option value="ALL">ทั้งหมด (All)</option>
        </select>
      </label>

      <div>
        <span class="u-meta">จัดเรียง: </span>
        <select id="sortSelect" class="sort-select">
          <option value="title">ตามตัวอักษรชื่อเพลง</option>
          <option value="artist">ตามชื่อศิลปิน</option>
          <option value="key">ตามคีย์เพลง</option>
          <option value="bpm">ตาม BPM</option>
          <option value="playCount">ตามความถี่ที่นำมาเล่น</option>
          <option value="recent">ล่าสุดที่เพิ่ม/แก้ไข</option>
        </select>
      </div>

      <div class="bk-line3"><label class="u-meta bk-nochord"><input type="checkbox" id="chkNoChord"> เฉพาะเพลงที่ยังไม่มีคอร์ด</label></div>
    </div>
  </div>

  <!-- ส่วนแสดงรายชื่อเพลง -->
  <div id="masterSongList" class="song-list">
    <p class="u-empty">กำลังโหลดคลังเพลง...</p>
  </div>
  <!-- เพลงจากฐานข้อมูลรองที่ตรงกับคำค้น (ยังไม่อยู่ในคลังหลัก) -->
  <div id="catSec"></div>

  <!-- แถบโหมดเลือกหลายเพลง (กดค้างที่การ์ดเพื่อเริ่ม) -->
  <div id="selBar" class="sel-bar hidden" role="toolbar" aria-label="เลือกหลายเพลง">
    <div class="sel-row">
      <div class="sel-n" id="selCount">เลือก 0 เพลง</div>
      <button type="button" id="selCancel" class="sel-ic" aria-label="ยกเลิก ออกจากโหมดเลือก"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button type="button" id="selShare" class="sel-ic" aria-label="แชร์เป็น ChordPro"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
      <button type="button" id="selMore" class="sel-ic" aria-label="เมนูอื่นๆ" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
    </div>
    <div id="selMenu" class="sel-menu hidden" role="menu">
      <button type="button" id="selTags" role="menuitem">แก้ไขแท็ก</button>
      <button type="button" id="selAll" role="menuitem">เลือกทั้งหมด</button>
      <button type="button" id="selInvert" role="menuitem">สลับการเลือก</button>
      <button type="button" id="selDelete" role="menuitem" class="danger">ลบเพลงที่เลือก</button>
    </div>
  </div>

  <div id="selDelOv" class="sub-overlay hidden" style="z-index:14700">
    <div class="form-box u-center" onclick="event.stopPropagation()">
      <h3 class="modal-title is-danger">ยืนยันการลบเพลง</h3>
      <p class="modal-desc" id="selDelMsg">-</p>
      <div class="u-row-center">
        <button id="selDelOk" class="btn-danger">ยืนยันลบ</button>
        <button id="selDelNo" class="btn-ghost">ยกเลิก</button>
      </div>
    </div>
  </div>

</div>

<script>
  window.initSongsPageModule = function() {
    let allSongsData = {};
    let allSetlistsData = {};
    let selectedKey = 'ALL';
    let isManualPinned = false;
    let tagF = null;                 // ปุ่ม # กรองตามแท็ก
    let selMode = false, shownIds = [];
    const selected = new Set();
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let catSeq = 0, catTimer = 0, catKey = '', catRows = {};

    // 📌 ดึงชื่อห้องปัจจุบันจาก session มาใช้ดึงข้อมูล setlists ให้ตรงวง
    const sessionStr = localStorage.getItem('lsh_session');
    const session = sessionStr ? JSON.parse(sessionStr) : {};
    const selectedRoom = lshRoom(session);
        if (!selectedRoom) return; // ไม่พบห้อง: ไม่เขียน/อ่านข้อมูลใดๆ และกลับไปหน้าเลือกห้อง

    // ลิสต์คีย์และคีย์คู่ขนาน ใช้ชุดกลางร่วมกันทุกหน้า (index.html: lshKeys)
    const masterKeyList = lshKeys.master;
    const relativeKeyMap = lshKeys.relative;

    function populateKeyFilterSelect() {
      const selectEl = document.getElementById('keyFilterSelect');
      if (!selectEl) return;

      let html = '<option value="ALL">ทั้งหมด (All)</option>';
      masterKeyList.forEach(k => {
        html += `<option value="${k}">${k}</option>`;
      });
      selectEl.innerHTML = html;

      selectEl.onchange = function() {
        selectedKey = this.value;
        onSearchOrFilterChange();
      };
    }

    function populateFormKeySelect() { /* ย้ายไปอยู่ใน lshSongKit (ฟอร์มสร้างเอง) */ }

    if (typeof db !== 'undefined') {
      // ดึงคลังเพลงกลาง
      db.ref('songs').on('value', (snapshot) => {
        window.lshReady && window.lshReady();
        allSongsData = snapshot.val() || {};
        if (!window.__songSyncTried) { window.__songSyncTried = true; setTimeout(() => { try { if (window.lshSongSync) window.lshSongSync.migrate(allSongsData); } catch (e) {} }, 1500); }   // ปรับเพลงที่ผูกฐานข้อมูลรองไว้แล้ว (ครั้งเดียว)
        if (tagF) tagF.prune();
        pruneSel();
        onSearchOrFilterChange();
      });

      // 📌 ดึงชุดลิสต์เพลง (setlists) ของห้องปัจจุบันมาคำนวณความถี่แบบ Realtime
      db.ref(`rooms/${selectedRoom}/setlists`).on('value', (snapshot) => {
        allSetlistsData = snapshot.val() || {};
        onSearchOrFilterChange();
      });
    }

    // 📌 ฟังก์ชันคำนวณความถี่ของเพลงจาก setlists ทั้งหมดในห้องนั้นๆ
    function calculateSongPlayCounts() {
      let counts = {};
      Object.keys(allSetlistsData).forEach(setId => {
        const setlist = allSetlistsData[setId];
        if (setlist && setlist.songs) {
          Object.keys(setlist.songs).forEach(sKey => {
            const songItem = setlist.songs[sKey];
            const sId = songItem.songId;
            if (sId) {
              counts[sId] = (counts[sId] || 0) + 1;
            }
          });
        }
      });
      return counts;
    }

    function onSearchOrFilterChange() {
      const searchEl = document.getElementById('songSearchInput');
      const sortEl = document.getElementById('sortSelect');
      if (!searchEl || !sortEl) return;

      const searchText = searchEl.value.trim().toLowerCase();
      const sortOption = sortEl.value;

      // คำนวณความถี่ล่าสุดจาก setlists
      const playCountsMap = calculateSongPlayCounts();

      let songList = Object.keys(allSongsData).map(id => ({
        id: id,
        ...allSongsData[id],
        playCount: playCountsMap[id] || 0
      }));

      if (selectedKey !== 'ALL') {
        let allowedKeys = new Set();
        allowedKeys.add(selectedKey.toLowerCase());
        if (relativeKeyMap[selectedKey]) {
          allowedKeys.add(relativeKeyMap[selectedKey].toLowerCase());
        }
        songList = songList.filter(song => song.key && allowedKeys.has(song.key.trim().toLowerCase()));
      }

      if (document.getElementById('chkNoChord') && document.getElementById('chkNoChord').checked) {
        songList = songList.filter(song => !(song.bk || (window.lshChordOwn && window.lshChordOwn.has(String(song.id)))));
      }

      if (searchText !== '') {
        let group1Prefix = [];
        let group2TitleContains = [];
        let group3ArtistContains = [];

        songList.forEach(song => {
          const titleLower = (song.title || '').toLowerCase();
          const artistLower = (song.artist || '').toLowerCase();

          if (titleLower.startsWith(searchText)) {
            group1Prefix.push(song);
          } else if (titleLower.includes(searchText)) {
            group2TitleContains.push(song);
          } else if (artistLower.includes(searchText)) {
            group3ArtistContains.push(song);
          }
        });

        sortSongArray(group1Prefix, sortOption);
        sortSongArray(group2TitleContains, sortOption);
        sortSongArray(group3ArtistContains, sortOption);

        songList = [...group1Prefix, ...group2TitleContains, ...group3ArtistContains];
      } else {
        sortSongArray(songList, sortOption);
      }

      if (tagF && tagF.sel.size) songList = lshTags.filter(songList, tagF.sel);   // ตรงครบทุกแท็กก่อน → ตรงบางแท็กตามจำนวนที่ตรง
      shownIds = songList.map(x => x.id);
      renderSongList(songList, searchText);
      updateSelBar();
      renderCatalogSection(searchText, searchText !== '' && selectedKey === 'ALL' && !(tagF && tagF.sel.size) && !selMode && !(document.getElementById('chkNoChord') && document.getElementById('chkNoChord').checked));
    }

    function sortSongArray(arr, option) {
      arr.sort((a, b) => {
        if (option === 'title') return (a.title || '').localeCompare(b.title || '', 'th');
        if (option === 'artist') return (a.artist || '').localeCompare(b.artist || '', 'th');
        if (option === 'key') return (a.key || '').localeCompare(b.key || '');
        if (option === 'bpm') return (b.bpm || 0) - (a.bpm || 0);
        if (option === 'playCount') return (b.playCount || 0) - (a.playCount || 0);
        if (option === 'recent') return ((b.updatedAt || 0) - (a.updatedAt || 0)) || String(b.id).localeCompare(String(a.id)); // เพลงเก่าที่ไม่มีเวลา เรียงตามรหัส (ใหม่สุดก่อน)
        return 0;
      });
    }

    function renderSongList(list, searchText) {
      const container = document.getElementById('masterSongList');
      if (!container) return;
      
      if (list.length === 0 && searchText) {
        container.innerHTML = '<p class="u-empty">ไม่พบเพลงนี้ในคลังเพลง</p>';
        return;
      }
      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state-box">
            <div style="font-size:32px;margin-bottom:8px"><svg class="ic ic-solo" aria-hidden="true"><use href="#i-music"/></svg></div>
            <div class="empty-state-title">ยังไม่มีรายการเพลงในระบบ</div>
            <div class="empty-state-desc">คลังเพลงกลางของคุณยังว่างอยู่ กดปุ่มด้านล่างเพื่อเริ่มสร้างเพลงแรกได้เลยครับ</div>
            <button class="add-song-btn" id="btnEmptyStateAdd">+ เพิ่มเพลงก้อนแรก</button>
          </div>
        `;
        const btnEmpty = document.getElementById('btnEmptyStateAdd');
        if (btnEmpty) {
          btnEmpty.onclick = () => document.getElementById('btnOpenAddSong').click();
        }
        return;
      }

      let html = '';
      list.forEach(song => {
        html += `
          <div class="song-card${selMode ? ' sel-mode' : ''}${selected.has(String(song.id)) ? ' sel-on' : ''}" data-songid="${song.id}">
            <div style="display:flex;align-items:center;min-width:0">
              ${selMode ? '<span class="sel-ck"></span>' : ''}
              <div>
                <div class="song-title">${esc(song.title) || 'ไม่ระบุชื่อ'}</div>
                <div class="song-artist">${esc(song.artist) || 'ไม่ระบุศิลปิน'}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:12px">
              <span style="font-size:12px;color:var(--c-f59e0b)">(${song.playCount || 0} ครั้ง)</span>
              <div class="song-key ${window.lshChordCls ? lshChordCls(song.id) : ''}" data-chordid="${song.id}">${song.key || '-'}</div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // ===== เพลงจากฐานข้อมูลรองที่ตรงกับคำค้น (ยังไม่อยู่ในคลังหลัก): "คุณหมายถึงเพลงนี้หรือเปล่า" 20 เพลงแรก =====
    function renderCatalogSection(text, show) {
      const host = document.getElementById('catSec'); if (!host) return;
      if (!show || !window.lshSongSync) { catSeq++; catKey = ''; host.innerHTML = ''; return; }
      const ex = new Set(); Object.keys(allSongsData).forEach(id => { const b = allSongsData[id] && allSongsData[id].bk; if (b) ex.add(b); });
      const key = text + '|' + ex.size; if (key === catKey) return;   // ข้อมูลเดิม ไม่วาดซ้ำ (กันกะพริบ)
      catKey = key; const my = ++catSeq;
      const head = '<div class="cat-head"><span>คุณหมายถึงเพลงนี้หรือเปล่า</span><i>จากฐานข้อมูลรอง</i></div>';
      if (!host.firstChild) host.innerHTML = head + '<div class="cat-load">กำลังค้นหา…</div>';
      clearTimeout(catTimer);
      catTimer = setTimeout(async () => {
        try {
          const rows = await window.lshSongSync.search(text, ex, 20); if (my !== catSeq) return;
          if (!rows.length) { host.innerHTML = ''; return; }
          const canAdd = window.lshSongSync.isMember(); catRows = {};
          host.innerHTML = head + rows.map(e => { catRows[e[0]] = e;
            return '<div class="song-card cat-card" data-bk="' + esc(e[0]) + '"><div style="display:flex;align-items:center;min-width:0"><div><div class="song-title">' + esc(e[1]) + '</div><div class="song-artist">' + esc(e[2] || 'ไม่ระบุศิลปิน') + '</div></div></div>' +
              '<div style="display:flex;align-items:center;gap:10px"><div class="song-key">' + esc(e[3] || '-') + '</div>' + (canAdd ? '<button type="button" class="cat-add" data-bk="' + esc(e[0]) + '" aria-label="เพิ่มเพลงนี้ลงฐานข้อมูล">+</button>' : '') + '</div></div>'; }).join('');
        } catch (er) { if (my === catSeq) { catKey = ''; host.innerHTML = head + '<div class="cat-load">โหลดฐานข้อมูลรองไม่ได้ ตรวจสอบอินเทอร์เน็ต</div>'; } }
      }, 200);
    }
    document.getElementById('catSec').addEventListener('click', async (e) => {
      const add = e.target.closest('.cat-add'), card = e.target.closest('.cat-card'); if (!card) return;
      const row = catRows[(add || card).getAttribute('data-bk')]; if (!row) return;
      if (add) { add.disabled = true; await window.lshSongSync.addFlow(row, () => allSongsData); add.disabled = false; }
      else if (window.lshSongKit && window.lshSongKit.openCatalog) window.lshSongKit.openCatalog(row, () => allSongsData);
    });

    // ===== โหมดเลือกหลายเพลง: กดค้างที่การ์ดเพื่อเริ่ม · แตะการ์ดอื่นเพื่อเลือก/เลิกเลือก =====
    const listEl = document.getElementById('masterSongList');
    function pruneSel() { Array.from(selected).forEach(id => { if (!allSongsData[id]) selected.delete(id); }); }
    function updateSelBar() {
      const n = selected.size;
      document.querySelector('.songs-container').classList.toggle('sel-active', selMode);
      document.getElementById('selBar').classList.toggle('hidden', !selMode);
      document.getElementById('selCount').textContent = 'เลือก ' + n + ' เพลง';
      ['selTags', 'selDelete', 'selShare'].forEach(id => { document.getElementById(id).disabled = n === 0; });
      if (!selMode) closeSelMenu();
      document.getElementById('selTags').style.display = lshTags.canEdit() ? '' : 'none';
    }
    function paintSel() {
      listEl.querySelectorAll('.song-card').forEach(c => c.classList.toggle('sel-on', selected.has(c.getAttribute('data-songid'))));
      updateSelBar();
    }
    function enterSel(id) { selMode = true; selected.clear(); if (id != null) selected.add(String(id)); onSearchOrFilterChange(); }
    function exitSel() { selMode = false; selected.clear(); onSearchOrFilterChange(); }
    let lpTimer = 0, lpX = 0, lpY = 0, lpSuppress = false;
    listEl.addEventListener('pointerdown', (e) => {
      const c = e.target.closest('.song-card'); if (!c || selMode || (e.button != null && e.button > 0) || !lshTags.canEdit()) return;
      lpX = e.clientX; lpY = e.clientY; clearTimeout(lpTimer);
      lpTimer = setTimeout(() => { lpTimer = 0; lpSuppress = true; enterSel(c.getAttribute('data-songid')); }, 480);
    });
    listEl.addEventListener('pointermove', (e) => { if (lpTimer && Math.hypot(e.clientX - lpX, e.clientY - lpY) > 10) { clearTimeout(lpTimer); lpTimer = 0; } });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => listEl.addEventListener(ev, () => { clearTimeout(lpTimer); lpTimer = 0; if (lpSuppress) setTimeout(() => { lpSuppress = false; }, 350); }));
    listEl.addEventListener('contextmenu', (e) => { if (e.target.closest('.song-card')) e.preventDefault(); });
    listEl.addEventListener('click', (e) => {
      const c = e.target.closest('.song-card'); if (!c) return;
      if (lpSuppress) { lpSuppress = false; return; }   // คลิกที่ตามหลังการกดค้าง ไม่นับ
      const id = c.getAttribute('data-songid');
      if (selMode) { if (selected.has(id)) selected.delete(id); else selected.add(id); paintSel(); }
      else openSongDetailDrawer(id);
    });
    function closeSelMenu() { const m = document.getElementById('selMenu'); if (m) m.classList.add('hidden'); const b = document.getElementById('selMore'); if (b) b.setAttribute('aria-expanded', 'false'); }
    document.getElementById('selMore').onclick = (e) => { e.stopPropagation(); const m = document.getElementById('selMenu'), open = m.classList.contains('hidden'); m.classList.toggle('hidden', !open); e.currentTarget.setAttribute('aria-expanded', open ? 'true' : 'false'); };
    document.getElementById('selMenu').onclick = (e) => { if (e.target.closest('button')) closeSelMenu(); };   // เลือกเมนูแล้วปิดเมนู (ปุ่มแต่ละอันทำงานตามเดิม)
    document.addEventListener('pointerdown', (e) => { const m = document.getElementById('selMenu'); if (m && !m.classList.contains('hidden') && !m.contains(e.target) && !e.target.closest('#selMore')) { closeSelMenu(); if (window.lshSwallowClick) window.lshSwallowClick(); } }, true);
    document.getElementById('selAll').onclick = () => { shownIds.forEach(id => selected.add(String(id))); paintSel(); };   // เฉพาะเพลงที่กรองแสดงอยู่
    document.getElementById('selInvert').onclick = () => { shownIds.forEach(id => { id = String(id); if (selected.has(id)) selected.delete(id); else selected.add(id); }); paintSel(); };
    document.getElementById('selCancel').onclick = exitSel;
    document.getElementById('selTags').onclick = () => { lshTags.edit({ ids: Array.from(selected), getSongs: () => allSongsData }); };
    document.getElementById('selShare').onclick = async () => {
      const b = document.getElementById('selShare'); b.disabled = true;
      try { await lshTags.exportCho(Array.from(selected), allSongsData); } catch (e) { lshToast('ส่งออกไม่สำเร็จ: ' + e.message, 'error'); }
      updateSelBar();
    };
    const delOv = document.getElementById('selDelOv');
    document.getElementById('selDelete').onclick = () => {
      const n = selected.size; if (!n) return;
      document.getElementById('selDelMsg').innerHTML = 'ลบ <b style="color:var(--c-ffffff)">' + n + ' เพลง</b> ออกจากคลังใช่หรือไม่?<br><span class="u-meta">ลบได้แม้เพลงอยู่ในลิสต์หรือคิว · ย้อนกลับไม่ได้</span>';
      delOv.classList.remove('hidden');
    };
    document.getElementById('selDelNo').onclick = () => delOv.classList.add('hidden');
    delOv.onclick = () => delOv.classList.add('hidden');
    document.getElementById('selDelOk').onclick = async () => {
      const upd = {}; selected.forEach(id => { upd[id] = null; });
      const ok = document.getElementById('selDelOk'); ok.disabled = true;
      try { await db.ref('songs').update(upd); delOv.classList.add('hidden'); lshToast('ลบ ' + selected.size + ' เพลงแล้ว', 'ok'); exitSel(); }
      catch (e) { lshToast('เกิดข้อผิดพลาดในการลบ: ' + e.message, 'error'); }
      ok.disabled = false;
    };

    const line2 = document.getElementById('headerLine2');
    const toggleBtn = document.getElementById('btnToggleLine2');
    const searchInput = document.getElementById('songSearchInput');

    function showLine2() {
      line2.classList.remove('collapsed');
      toggleBtn.innerHTML = lshIcon('chev-up');
      toggleBtn.classList.add('active');
    }

    function hideLine2() {
      if (!isManualPinned) {
        line2.classList.add('collapsed');
        toggleBtn.innerHTML = lshIcon('chev-down');
        toggleBtn.classList.remove('active');
      }
    }

    if (toggleBtn && line2 && searchInput) {
      toggleBtn.onclick = () => {
        isManualPinned = !isManualPinned;
        if (isManualPinned) {
          showLine2();
        } else {
          line2.classList.add('collapsed');
          toggleBtn.innerHTML = lshIcon('chev-down');
          toggleBtn.classList.remove('active');
        }
      };

      searchInput.onfocus = () => showLine2();
      searchInput.oninput = () => {
        showLine2();
        onSearchOrFilterChange();
      };

      searchInput.onblur = () => {
        setTimeout(() => {
          if (document.activeElement !== document.getElementById('keyFilterSelect') &&
              document.activeElement !== document.getElementById('keyFilterBtn') &&
              document.activeElement !== document.getElementById('sortSelect')) {
            hideLine2();
          }
        }, 200);
      };
    }

    function openSongDetailDrawer(songId) { lshSongKit.open(songId); }
    function closeSongDetailDrawer() { lshSongKit.close(); }

    lshSongKit.setup({
      getAll: () => allSongsData,
      getPlayCount: (id) => calculateSongPlayCounts()[id] || 0,
      allowDelete: true
    });

    // ปุ่ม # กรองตามแท็ก (แยกจากช่องค้นหา)
    const hdr1 = document.querySelector('.header-line-1');
    tagF = lshTags.mountFilter(hdr1, { id: 'btnTagFilter', getSongs: () => allSongsData, onChange: () => onSearchOrFilterChange() });
    hdr1.insertBefore(tagF.btn, document.getElementById('btnToggleLine2'));

    // Bind Controls
    populateKeyFilterSelect();
    lshKeyFilter.fromSelect(document.getElementById('keyFilterSelect'), { id: 'keyFilterBtn' });
    populateFormKeySelect();

    document.getElementById('sortSelect').onchange = onSearchOrFilterChange;
    document.getElementById('chkNoChord').onchange = onSearchOrFilterChange;

    document.getElementById('btnOpenAddSong').onclick = () => { if (window.lshBulkAdd) window.lshBulkAdd.start(); };   // เพิ่มเพลง = ตารางกรอกชื่อ/ศิลปิน (1–20 เพลง) → ตรวจซ้ำ → ค้นฐานข้อมูลรอง
  };

  window.initSongsPageModule();
</script>
