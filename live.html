<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stage Hub - Live</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== หน้า Live (2.0): รวมหน้าคอร์ด + หน้าจัดคิว — ใช้ตัวแปรสีเดิมจาก style.css ===== */
    .lv { --set-1:#5B8CFF; --set-2:#F5A524; --set-3:#3DDC84; --set-4:#B084FF; --set-5:#22D3EE; --live:#35e6c0; --live-ink:#0a0c10; --live-soft:rgba(53,230,192,.12); --live-line:rgba(53,230,192,.6); --bg:#0a0c10; --surface:#12151b; --surface-2:#171b23; --surface-3:#1f242e; --line:#232832; --line-strong:#2a303c; --text:#eef1f6; --text-2:#c4cad6; --text-3:#8a93a3; --next:#F5A524; --next-ink:#0a0c10; --next-soft:rgba(245,165,36,.14); --danger:#ff6b6b; --danger-soft:rgba(255,107,107,.14); --request:#FF5FD2; --request-soft:rgba(255,95,210,.14); background: var(--bg); position: relative; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; height: 100%; color: var(--text); }
    .lv * { box-sizing: border-box; }
    .lv button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .lv .lv-top { display: flex; gap: 10px; padding: 12px 16px 0; flex: none; }
    .lv .lv-top .top-box { flex: 1; min-width: 0; }
    .lv-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 0 190px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    /* แถบควบคุม */
    .lv-strip { display: flex; align-items: center; gap: 8px; padding: 12px 16px 0; }
    .lv-venue { flex: 1; min-width: 0; font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lv-pp { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--live-line); background: var(--live-soft); display: flex; align-items: center; justify-content: center; padding: 0; color: var(--live); }
    .lv-pp.paused { border-color: var(--next); background: var(--next-soft); color: var(--next); }
    .lv-pp svg { width: 20px; height: 20px; fill: currentColor; }
    .lv-autolbl { font-size: 12px; color: var(--text-3); line-height: 1.2; width: 54px; }
    .lv-sw { flex: none; width: 52px; height: 30px; border-radius: 999px; padding: 3px; border: 0; background: var(--surface-3); display: flex; justify-content: flex-start; }
    .lv-sw i { width: 24px; height: 24px; border-radius: 50%; background: var(--bg); display: block; }
    .lv-sw[aria-checked="true"] { background: var(--live); justify-content: flex-end; }
    .lv-tchip { flex: none; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text-2); font-size: 14px; font-weight: 600; }
    .lv-tchip svg { width: 18px; height: 18px; stroke: var(--live); fill: none; stroke-width: 2; stroke-linecap: round; }
    .lv-tchip.over { border-color: var(--danger); color: var(--danger); }
    .lv-chev { display: flex; justify-content: center; padding-top: 6px; }
    .lv-chev button { width: 46px; height: 22px; border-radius: 0 0 12px 12px; border: 1px solid #2a303c; border-top: 0; background: #171b23; color: var(--text-3); display: flex; align-items: center; justify-content: center; padding: 0; }
    .lv-chev button.on { border-color: #1f6b5c; background: #0f2a26; color: #35e6c0; }
    .lv-chev button.brk { border-color: #7a5a1e; background: #2a2112; color: #F5A524; }
    /* แถบควบคุม 2.0: บรรทัด 1 (ชื่อร้าน + ตามเพลงที่เล่น) · บรรทัด 2 (ตั้งเวลา · พอส · เลื่อนอัตโนมัติ เฉพาะสมาชิกหลัก) · แถบย่อเต็มความกว้าง 4 สี */
    .lv-strip { display: block; padding: 0; }
    .lv-r1 { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; }
    .lv-r2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 16px 8px; }
    .lv-r2l, .lv-r2r { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .lv-r2r { justify-content: flex-end; }
    .lv-r2m { flex: none; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; }
    .lv-r2m .lv-pp { width: 56px; height: 56px; }
    .lv-r1 .lv-autolbl { width: auto; text-align: right; }
    .lv-sw.white[aria-checked="true"] { background: #eef1f6; }
    .lv-sbar { --bc: #3a404c; --bk: #8a93a3; position: relative; height: 30px; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
    .lv-sbar::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1px; background: var(--bc); }
    .lv-sbar[data-s="follow"] { --bc: #eef1f6; --bk: #eef1f6; }
    .lv-sbar[data-s="auto"] { --bc: #6ee7c3; --bk: #6ee7c3; }
    .lv-sbar[data-s="both"] { --bc: linear-gradient(90deg, #eef1f6, #6ee7c3); --bk: #cfeee3; }
    .lv-sbar button { position: relative; width: 52px; height: 24px; border-radius: 12px; border: 1.5px solid var(--bk); background: var(--bg); color: var(--bk); display: flex; align-items: center; justify-content: center; padding: 0; }
    .lv-sbar[data-s="off"] button { border-color: #3a404c; }
    .lv-sbar button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    /* ===== แนวนอน (หน้าจอสูง ≤ 640px): ดูคอร์ดอย่างเดียว ===== */
    .lv-land { display: none; }
    @media (orientation: landscape) and (max-height: 640px) {
      body.lsh-page-live { display: grid !important; grid-template-columns: 64px minmax(0,1fr); grid-template-rows: auto auto 1fr auto; height: 100dvh; }
      body.lsh-page-live > header { display: contents; }
      body.lsh-page-live .header-left, body.lsh-page-live #showTimerDisplay, body.lsh-page-live .hdr-acct { display: none !important; }
      body.lsh-page-live > nav #nav-search, body.lsh-page-live > nav #nav-queue { display: none; }
      body.lsh-page-live > nav { grid-column: 1; grid-row: 3; flex-direction: column; justify-content: flex-start; height: auto; padding: 10px 8px; gap: 8px; align-items: stretch; min-height: 0; border-top: 0; background: var(--bg); }
      body.lsh-page-live > nav button { width: 100%; height: auto; min-height: 0; max-height: none; margin: 0; flex: 3 1 0; border-radius: 14px; justify-content: center; }
      body.lsh-page-live > nav button.active { flex: 1 1 0; }
      body.lsh-page-live > nav button .nav-label { display: none; }
      body.lsh-page-live > nav button.active::before { border-radius: 14px; }
      body.lsh-page-live > nav button .nav-ico .ic, body.lsh-page-live > nav button svg { width: 26px; height: 26px; }
      body.lsh-page-live .header-right { grid-column: 1; grid-row: 4; flex-direction: column; gap: 6px; padding: 6px 0 10px; background: var(--bg); justify-content: center; }
      body.lsh-page-live #pingBadge { font-size: 10px; }
      body.lsh-page-live > main { grid-column: 2; grid-row: 1 / -1; min-height: 0; border-left: 1px solid var(--line); }
      .lv .lv-top, .lv #lvStrip, .lv #lvActs, .lv #lvScroll, .lv #lvCtrl, .lv #lvUndo { display: none !important; }
      .lv { height: 100%; }
      .lv-land { display: flex; position: relative; height: 100%; min-height: 0; }
      .lv-lseg { flex: none; width: 34px; margin: 0; padding: 12px 10px; border: 0; background: transparent; display: flex; flex-direction: column; gap: 3px; cursor: pointer; }
      .lv-lsg { flex: 1 1 0; min-height: 3px; border-radius: 4px; background: var(--c); display: block; }
      .lv-lsg.done { opacity: .35; }
      .lv-lsg.now { background: var(--live); }
      .lv-lsg.view { box-shadow: 0 0 0 2px #eef1f6; }
      .lv-lmain { flex: 1; min-width: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 16px 6px; }
      .lv-lmain .lv-exp { margin: 0; padding: 0; width: auto; flex: none; }
      .lv-lmain .lv-tools { margin-top: 0; padding: 8px 0; flex-wrap: nowrap; border-top: 0; position: sticky; top: 0; background: var(--bg); z-index: 1; }
      .lv-lt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
      .lv-lt b { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .lv-lt span { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .lv-lscrim { position: absolute; inset: 0; z-index: 4; background: rgba(0,0,0,.35); }
      .lv-lpanel { position: absolute; left: 0; top: 0; bottom: 0; width: min(300px, 62%); z-index: 5; background: #0d0f14; border-right: 1px solid var(--line-strong); box-shadow: 8px 0 24px rgba(0,0,0,.5); display: flex; flex-direction: column; min-height: 0; }
      .lv-lph { display: flex; align-items: center; gap: 10px; padding: 10px 12px 6px; flex: none; }
      .lv-lph .lv-venue { font-size: 16px; }
      .lv-lhint { padding: 0 12px 8px; font-size: 12px; color: var(--text-3); flex: none; }
      .lv-lrows { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 5px; }
      .lv-lrow { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; flex: none; padding: 8px 10px 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); text-align: left; font-size: 14px; font-weight: 600; }
      .lv-lrow::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 2px 2px 0; background: var(--c); }
      .lv-lrow .n { width: 18px; font-size: 12px; color: var(--text-3); font-weight: 400; flex: none; }
      .lv-lrow .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .lv-lrow.done { opacity: .5; }
      .lv-lrow.now { border: 1.5px solid var(--live); background: var(--live-soft); }
      .lv-lrow.nxt { border: 1.5px solid #5b7cff; background: #0f1424; }
      .lv-lrow.view { box-shadow: 0 0 0 2px #eef1f6; }
      .lv-lt1 { font-size: 11px; color: var(--live); } .lv-lt2 { font-size: 11px; color: #eef1f6; } .lv-lt3 { font-size: 11px; color: #8fa4ff; }
    }
    .lv-tchip.ic { width: 40px; padding: 0; justify-content: center; border-radius: 50%; }
    .lv-chev svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    /* แถวปุ่ม: ลูกค้าขอเพลง / จัดคิว */
    .lv-acts { display: flex; align-items: center; gap: 8px; padding: 12px 16px 8px; }
    .lv-btn { height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; padding: 0 14px; position: relative; }
    .lv-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .lv-btn.req { flex: 1; border-color: var(--request); background: var(--request-soft); color: var(--request); font-weight: 700; }
    .lv-btn.ins { flex: 1; background: var(--surface-3); border: 1px solid var(--text-2); color: var(--text); }
    .lv-btn.save { background: var(--live); border-color: var(--live); color: var(--live-ink); font-weight: 700; }
    .lv-btn.save.ring { box-shadow: 0 0 0 3px rgba(46,242,184,.55), 0 0 0 7px rgba(46,242,184,.22); animation: lvRing 1s ease-in-out infinite; }
    .lv-btn.save.fail { background: var(--danger); border-color: var(--danger); color: #fff; }
    @keyframes lvRing { 50% { box-shadow: 0 0 0 1px rgba(46,242,184,.2), 0 0 0 3px rgba(46,242,184,.1); } }
    .lv-badge { position: absolute; top: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--request); color: var(--bg); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px rgba(255,95,210,.35); }
    /* รายการ */
    .lv-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
    .lv-played { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-3); padding: 2px 4px; background: none; border: 0; text-align: left; }
    .lv-played svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; transition: transform .15s; }
    .lv-played.open svg { transform: rotate(90deg); }
    .lv-card { --c: var(--set-1); display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 16px; background: var(--surface); position: relative; }
    .lv-card.next { border: 1.5px solid #5b7cff; background: #0f1424; }
    .lv-card.next .lv-tag { color: #8fa4ff; }
    .lv-card.playing { border: 1.5px solid var(--live); border-left: 4px solid var(--c); }
    .lv-card.played { opacity: .5; }
    .lv-card.req { --c: var(--request); } .lv-card.custom { --c: var(--custom); }
    .lv-card.removed { opacity: .6; }
    .lv-no { width: 18px; flex: none; color: var(--text-3); font-size: 15px; padding-top: 2px; }
    .lv-body { flex: 1; min-width: 0; }
    .lv-tag { font-size: 11px; font-weight: 700; color: var(--c); }
    .lv-tag.live { color: var(--live); display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .lv-tag.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--live); display: inline-block; }
    .lv-title { font-size: 16px; font-weight: 700; word-break: break-word; }
    .lv-art { font-size: 13px; color: var(--text-3); margin-top: 1px; }
    .lv-key { display: inline-block; margin-left: 8px; padding: 0 6px; border: 1px solid var(--c); border-radius: 6px; font-size: 13px; color: var(--text-2); }
    .lv-ic { flex: none; width: 36px; height: 36px; margin: -6px -6px 0 0; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: var(--text-3); padding: 0; }
    .lv-ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .lv-ic.go svg { stroke: var(--live); }
    .lv-bar { --c: var(--set-1); height: 12px; margin: 2px 0; border-radius: 6px; background: var(--c); }
    .lv-bar.cur { height: 20px; box-shadow: 0 0 0 3px var(--bg), 0 0 0 4.5px var(--live); }
    .lv-bar.passed { opacity: .45; }
    .lv-bar.nextb { height: 20px; }
    .lv-barrow { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
    .lv-barrow .lv-bar { flex: 1; margin: 0; height: 10px; }
    .lv-prog { margin-top: 8px; }
    .lv-prog .tr { height: 6px; border-radius: 3px; background: var(--surface-3); } .lv-prog .tr i { display: block; height: 6px; border-radius: 3px; background: var(--c); width: 0; }
    .lv-prog .tm { display: flex; justify-content: space-between; margin-top: 4px; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    /* การ์ดขยาย: คอร์ด */
    .lv-exp { flex: 0 0 100%; min-width: 0; margin: 8px -14px 0 -30px; padding-left: 30px; width: calc(100% + 44px); }
    .lv-card .lv-main { display: flex; align-items: flex-start; gap: 12px; width: 100%; }
    .lv-card.open { flex-direction: column; align-items: stretch; }
    .lv-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 8px; }
    .lv-seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .lv-seg button { width: 40px; height: 34px; border: 0; background: var(--surface); color: var(--text-2); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0; }
    .lv-seg button.on { background: var(--live); color: var(--live-ink); }
    .lv-seg svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .lv-status { margin-top: 12px; font-size: 13px; color: var(--text-3); }
    .lv-exp .ch-body { padding-top: 12px; padding-bottom: 20px; }
    .lv-exp.lyr .ch-c, .lv-exp.lyr .ch-rawc { display: none; }
    .lv-exp.lyr .ch-seg { display: inline; } .lv-exp.lyr .ch-t { display: inline; white-space: pre-wrap; }
    .lv-exp.cols2 .ch-body { column-count: 2; column-gap: 24px; column-rule: 1px solid var(--line); }
    /* ปุ่มลอยมุมขวาล่าง */
    .lv-ctrl { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 20; }
    .lv-ctrl .row { display: flex; align-items: center; gap: 10px; }
    .lv-fab { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line-strong); background: #0f1218; color: var(--text); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,.5); padding: 0; }
    .lv-fab svg { width: 22px; height: 22px; fill: currentColor; stroke: none; }
    .lv-fab.go { background: var(--live); border-color: var(--live); color: var(--live-ink); }
    .lv-fab.big { width: 64px; height: 64px; } .lv-fab.big svg { width: 28px; height: 28px; }
    .lv-fab.resume { background: var(--next); border-color: var(--next); color: var(--next-ink); }
    .lv-fab.stop { background: #ff6b6b; border-color: #ff6b6b; color: #0a0c10; }
    .lv-pill { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 999px; border: 1px solid #2a303c; background: #171b23; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
    .lv-pill .lv-fab { box-shadow: none; }
    .lv-pc { width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; color: var(--text-3); }
    .lv-pc svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .lv-ptab { width: 40px; height: 56px; border-radius: 28px 0 0 28px; margin-right: -14px; border: 1px solid #2a303c; border-right: 0; background: #171b23; display: flex; align-items: center; justify-content: center; padding: 0; color: var(--text-2); box-shadow: 0 6px 18px rgba(0,0,0,.5); }
    .lv-ptab svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .lv-fab.ring { box-shadow: 0 0 0 3px rgba(46,242,184,.55), 0 0 0 7px rgba(46,242,184,.22); }
    .lv-fab:disabled { opacity: .35; }
    .lv-cap { height: 64px; padding: 0 24px; border-radius: 32px; border: 0; background: #e8a838; color: #0a0c10; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
    .lv-cap svg { width: 24px; height: 24px; fill: currentColor; }
    .lv-cap.ring { box-shadow: 0 0 0 3px rgba(255,194,51,.55), 0 0 0 7px rgba(255,194,51,.22); }
    .lv-hold { padding: 6px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line-strong); font-size: 12px; color: var(--text-2); box-shadow: 0 6px 18px rgba(0,0,0,.5); }
    .lv-undo { position: absolute; left: 14px; bottom: 14px; z-index: 20; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text-2); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
    .lv-undo svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    /* แบนเนอร์ */
    .lv-banner { margin: 10px 16px 0; padding: 10px 14px; border-radius: 14px; border: 1px solid; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
    .lv-banner b { display: block; font-size: 14px; } .lv-banner span { color: var(--text-2); }
    .lv-banner.ok { background: #0f2a26; border-color: var(--live); color: var(--live); }
    .lv-banner.warn { background: #2a2112; border-color: var(--next); color: var(--next); }
    .lv-banner.err { background: #2a1517; border-color: #ff8d8d; color: #ff8d8d; }
    .lv-dirty { font-size: 11px; font-weight: 700; color: var(--next); background: var(--next-soft); padding: 1px 7px; border-radius: 999px; display: inline-block; margin-left: 6px; }
    /* โหมดจัดคิว */
    .lv-grip { flex: none; width: 22px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--text-3); touch-action: none; }
    .lv-grip svg { width: 16px; height: 22px; fill: currentColor; }
    .lv-card.locked { border-color: var(--live); }
    .lv-card:has(> .lv-main) { flex-direction: column; align-items: stretch; gap: 0; }

<div class="lv" id="lvRoot">

    </div>
    <div id="topNextBox" class="top-box">
      <span class="top-title">เพลงถัดไป</span>
      <div id="topNextText" class="top-content">-</div>
    </div>
  </div>

    <div id="lvBanner"></div>
    <div class="lv-list" id="lvList"><div class="lv-empty">กำลังโหลดคิวเพลง…</div></div>
  </div>
  <div class="lv-land" id="lvLand"></div>
  <div id="lvCtrl" class="lv-ctrl"></div>
  <div id="lvUndo"></div>
  <div id="lvOv"></div>

<script>
  window.initLivePageModule = function() {
    if (window.__lv && window.__lv.dispose) { try { window.__lv.dispose(); } catch (e) {} }
    const $ = (id) => document.getElementById(id);
    let session = {}; try { session = JSON.parse(localStorage.getItem('lsh_session') || '{}'); } catch (e) {}
    const room = lshRoom(session);
    if (!room) return;
    const guest = (typeof lshIsGuest === 'function') ? lshIsGuest(session) : (session.userType === 'guest');
    // สมาชิกหลักของวง = ไม่ใช่ guest และไม่ใช่สมาชิกที่เข้ามาเยี่ยมวงอื่นด้วยรหัส (visit) · ใช้กับแถวควบคุมเลื่อนอัตโนมัติ/ตั้งเวลา
    const visiting = (typeof lshIsVisiting === 'function') ? lshIsVisiting(session) : false;
    const canCtl = !guest && !visiting;
    const me = session.nickname || session.username || '';
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const jattr = (o) => esc(JSON.stringify(o));
    const NO_CHORD_TXT = 'ยังไม่มีข้อมูลคอร์ดในฐานข้อมูล';
    /*CORE-START*/
    // ===== ตรรกะคิว (ไม่แตะหน้าจอ — ทดสอบแยกได้) =====
    const SP = (x) => !!x && (x.type === 'dummy_start' || x.type === 'dummy_end');
    const isBrk = (x) => !!x && x.type === 'break';
    const isSong = (x) => !!x && !SP(x) && !isBrk(x);
    const isIns = (x) => !!x && (x.type === 'inserted-custom' || x.type === 'inserted-request');
    const isMed = (x) => !!x && Array.isArray(x.parts) && x.parts.length > 0;
    const sn = (s) => String(s || 'Set 1').replace(/\D/g, '') || '1';
    const toArr = (v) => { if (!v) return []; if (Array.isArray(v)) return v.filter(Boolean); return Object.keys(v).sort((a, b) => a - b).map((k) => v[k]).filter(Boolean); };
    const clone = (l) => l.map((x) => Object.assign({}, x));
    const clean = (l) => JSON.parse(JSON.stringify(l));
    const actOf = (l) => l.filter((x) => x.status !== 'removed');
    const START = () => ({ id: 'dummy_start', title: '🔴 เตรียมพร้อมสำหรับการแสดง', artist: '', status: 'playing', type: 'dummy_start' });
    const END = () => ({ id: 'dummy_end', title: '🏁 จบการแสดง', artist: '', status: 'normal', type: 'dummy_end' });

    // เติมเส้นพักคุยตรงรอยต่อเซ็ตของคิวเก่า (ที่มีแต่ป้าย Set N) — ทำครั้งเดียวเมื่อยังไม่มีเส้นเลย
    function ensureBreaks(list) {
      if (list.some(isBrk)) return list;
      const out = []; let prev = null, changed = false;
      list.forEach((x) => {
        if (isSong(x) && x.status !== 'removed' && !isIns(x) && /^Set \d+$/.test(x.set || 'Set 1')) {
          const s = x.set || 'Set 1';
          if (prev !== null && s !== prev) { out.push({ id: 'brk_' + sn(s), type: 'break', title: 'พักคุย', artist: '', key: '-', bpm: '-', note: '-', set: s, status: x.status === 'played' ? 'played' : 'normal' }); changed = true; }
          prev = s;
        }
        out.push(x);
      });
      return changed ? out : list;
    }

    // จัดคิวให้ครบองค์ประกอบ: การ์ดเริ่ม/จบ, สีเซ็ตตามเส้น, สถานะ next/standby
    function normalize(list) {
      const L = list.filter(Boolean);
      if (!L.length) return L;
      if (!L.some((x) => x.type === 'dummy_start')) { const started = L.some((x) => x.type !== 'dummy_end' && (x.status === 'playing' || x.status === 'played')); const s = START(); s.status = started ? 'played' : 'playing'; L.unshift(s); }
      if (!L.some((x) => x.type === 'dummy_end')) L.push(END());
      const ei = L.findIndex((x) => x.type === 'dummy_end'); if (ei !== L.length - 1) L.push(L.splice(ei, 1)[0]);
      const si = L.findIndex((x) => x.type === 'dummy_start'); if (si > 0) L.unshift(L.splice(si, 1)[0]);
      if (L.some((x) => isBrk(x) && x.status !== 'removed')) {   // สีเซ็ตของเพลง = เซ็ตของเส้นที่อยู่ก่อนหน้า (รีเควส/แทรกใช้สีของตัวเอง)
        let cur = null;
        L.forEach((x) => {
          if (x.status === 'removed') return;
          if (isBrk(x)) { cur = x.set || 'Set 1'; return; }
          if (isSong(x) && !isIns(x)) { if (cur === null) cur = x.set || 'Set 1'; x.set = cur; }
        });
      }
      // สถานะ next / standby (เหมือนหน้าจัดคิวเดิม)
      const active = L.filter((x) => x.status !== 'removed' && x.status !== 'played');
      if (active.length) {
        if (!L.some((x) => x.status === 'playing')) {
          L.forEach((x) => { if (x.status === 'next' || x.status === 'standby') x.status = 'normal'; });
          active[0].status = 'playing'; if (active[1]) active[1].status = 'next'; if (active[2]) active[2].status = 'standby';
        } else {
          let an = false, as = false;
          L.forEach((x) => {
            if (x.status === 'removed' || x.status === 'played') return;
            if (x.status === 'playing') { an = true; return; }
            if (an) { x.status = 'next'; an = false; as = true; return; }
            if (as) { x.status = 'standby'; as = false; return; }
            if (x.status === 'next' || x.status === 'standby') x.status = 'normal';
          });
        }
      }
      return L;
    }

    // ลายเซ็น "โครงสร้าง" ของคิว (ลำดับ/ชนิด/คีย์/การลบ) — ไม่รวมสถานะการเล่นและการข้าม
    const sigOf = (l) => l.map((x) => [x.id, x.type || '', x.key || '', (x.status === 'removed' && x.rm !== 'skip') ? 'r' : ''].join(':')).join('|');
    const playingOf = (l) => l.find((x) => x.status === 'playing') || null;
    const elapsedMs = (x, now) => (x && x.playedMs != null) ? x.playedMs : (x && x.startedAt ? Math.max(0, now - x.startedAt) : 1e12);

    // เลื่อนจากเพลง fromId ไป toId (ค่าสัมบูรณ์ "จาก X ไป Y" — ถ้าคนอื่นเลื่อนไปก่อนแล้ว fromId จะไม่ใช่เพลงที่เล่นอยู่ → คืน null ไม่ทำซ้ำ)
    function advanceTo(list, fromId, toId, now, opt) {
      const L = clone(list), act = actOf(L);
      const fi = act.findIndex((x) => x.id === fromId), ti = act.findIndex((x) => x.id === toId);
      if (fi < 0 || ti < 0 || fi === ti || act[fi].status !== 'playing') return null;
      const from = act[fi], to = act[ti];
      if (ti > fi) {
        for (let k = fi + 1; k < ti; k++) act[k].status = 'played';
        from.status = 'played';
        // เพลงที่เพิ่งเข้ามาแล้วถูกเลื่อนต่อภายใน 10 วินาที (ไม่นับช่วงพอส) และไม่เคยได้เล่นจริง = ถูกข้าม ย้ายเป็นเพลงที่ถูกข้าม
        if (isSong(from) && !from.heard && !(opt && opt.auto) && elapsedMs(from, now) < 10000) { from.status = 'removed'; from.rm = 'skip'; from.oldStatus = 'normal'; delete from.startedAt; delete from.playedMs; }
        else { from.heard = true; }
      } else {
        from.status = 'normal'; delete from.startedAt; delete from.playedMs; delete from.pauseFrom;
        for (let k = ti + 1; k < fi; k++) act[k].status = 'normal';
      }
      to.status = 'playing'; to.startedAt = now; delete to.playedMs; delete to.pauseFrom;
      return normalize(L);
    }
    const nextOf = (list, id) => { const a = actOf(list), i = a.findIndex((x) => x.id === id); return i >= 0 && i < a.length - 1 ? a[i + 1] : null; };
    const prevOf = (list, id) => { const a = actOf(list), i = a.findIndex((x) => x.id === id); return i > 0 ? a[i - 1] : null; };
    // เพลงจริงสุดท้ายในคิว (ใช้ปิดปุ่ม "ถัดไป" และขึ้นปุ่มจบการแสดง)
    const lastReal = (list) => { const a = actOf(list).filter(isSong); return a.length ? a[a.length - 1] : null; };

    // พอส/เพลย์ของหน้า Live: เก็บเวลาที่เล่นไปแล้วไว้ที่รายการ เพื่อไม่นับช่วงพอสในกฎ 10 วินาที
    function stampPause(list, now) { const L = clone(list), p = playingOf(L); if (!p) return null; p.playedMs = (p.startedAt ? now - p.startedAt : 0); return L; }

      if (k === 'cols') { ui.cols2 = v === '2'; lsSave('lsh_chord_cols', v); }
      else if (k === 'mode') { ui.lyr = v === 'l'; lsSave('lsh_chord_lyr', ui.lyr ? '1' : '0'); }
      else if (k === 'fs') { ui.fs = Math.max(12, Math.min(40, ui.fs + (v === '+' ? 2 : -2))); lsSave('lsh_chord_fs', String(ui.fs)); }
      const exp = btn.closest('.lv-exp'); if (!exp) return;
      exp.classList.toggle('lyr', ui.lyr); exp.classList.toggle('cols2', ui.cols2);
      const bd = exp.querySelector('.ch-body'); if (bd) bd.style.fontSize = ui.fs + 'px';
      exp.querySelectorAll('.lv-seg').forEach((sg) => { const kk = sg.dataset.k; sg.querySelectorAll('button').forEach((b) => { if (kk === 'cols') b.classList.toggle('on', (b.dataset.v === '2') === ui.cols2); else if (kk === 'mode') b.classList.toggle('on', (b.dataset.v === 'l') === ui.lyr); }); });
    }

    // ===== รับการกด/เปลี่ยนค่าทั้งหมดผ่านตัวกลางตัวเดียว =====
    const root = $('lvRoot');
    function onClick(ev) {
      const seg = ev.target.closest && ev.target.closest('.lv-seg button'); if (seg && root.contains(seg)) { ev.stopPropagation(); toggleSeg(seg); return; }
      let el = ev.target.closest ? ev.target.closest('[data-a]') : null;
      while (el && root.contains(el)) {
        const a = el.dataset.a, id = el.dataset.id;
        if (a === 'stop-prop') return;   // ภายในกล่องที่ไม่ให้กดทะลุ (เช่น ตัวเนื้อหาคอร์ด/พื้นของหน้าต่าง)
        if (act(a, el, id, ev)) return;
        el = el.parentElement ? el.parentElement.closest('[data-a]') : null;
      }
    }
    function act(a, el, id, ev) {
      switch (a) {
        case 'strip': ui.stripOpen = !ui.stripOpen; lsSave('lsh_lv_strip', ui.stripOpen ? '1' : '0'); renderStrip(); return true;
        case 'landopen': ui.landOpen = true; renderLand(); return true;
        case 'landclose': ui.landOpen = false; renderLand(); return true;
        case 'landpick': ui.exId = id; ui.landOpen = false; renderLand(); return true;   // เลือกเพลงดูคอร์ด แล้วแผงย่อกลับเอง
        case 'followsw': {   // ตามเพลงที่เล่น: ตั้งค่าส่วนตัว เก็บในเครื่อง ไม่เขียน Firebase
          const was = expandedId(cur()); ui.follow = !ui.follow; lsSave('lsh_lv_follow', ui.follow ? '1' : '0');
          ui.exId = ui.follow ? null : (was == null ? 'none' : was);   // เปิด: เพลงที่เล่นขยายทันที · ปิด: คงที่ที่เปิดอยู่ไว้
          ui.landKey = null; renderStrip(); renderList(); renderLand(); return true; }
        case 'ctrltog': { const ai = autoInfo(), col = ui.ctrlOpen == null ? ai.enabled : !ui.ctrlOpen; clearTimeout(timers.ctrl); if (col) { ui.ctrlOpen = true; if (ai.enabled) timers.ctrl = setTimeout(() => { ui.ctrlOpen = null; renderCtrl(); }, 15000); } else ui.ctrlOpen = ai.enabled ? null : false; renderCtrl(); return true; }
        case 'autopp': if (canCtl) autoPP(); return true;
        case 'autosw': { const ai = window.lshAutoAdv; if (!ai || !canCtl) return true; const i = autoInfo(); ai.setEnabled(!i.enabled); setTimeout(render, 150); return true; }
        case 'timer': if (canCtl) ovTimer(); return true;
        case 'tm-toggle': { const t = window.lshShowTimer, st = t.state(); t.setConfig({ enabled: !st.enabled }); closeOv(); return true; }
        case 'tm-adj': { const t = window.lshShowTimer, st = t.state(), d = Number(el.dataset.d); t.setConfig({ durationMin: Math.max(15, Math.min(480, (Number(st.durationMin) || 90) + d)) }); setTimeout(ovTimer, 150); return true; }
        case 'tm-reset': pop('รีเซ็ตจับเวลา?', 'เริ่มนับใหม่และล้างสถานะจบโชว์', [{ t: 'รีเซ็ต', c: 'warn', fn: () => { closeOv(); window.lshShowTimer.reset(); } }, { t: 'ยกเลิก', fn: closeOv }]); return true;
        case 'req': openReq(); return true;
        case 'edit': enterEdit(); return true;
        case 'exitedit': exitEdit(); return true;
        case 'save': save(false); return true;
        case 'undo': undo(); return true;
        case 'insert': openInsert(); return true;
        case 'played': ui.playedOpen = !ui.playedOpen; renderList(); return true;
        case 'next': if (!guest) press(1); return true;
        case 'prev': if (!guest) press(-1); return true;
        case 'stop': if (guest) return true; pop('จบการแสดง?', 'จะส่งเพลงสุดท้ายเป็น “จบ” ทันที และหยุดนับเวลา', [{ t: 'จบการแสดง', c: 'warn', fn: doStop }, { t: 'ยกเลิก', fn: closeOv }]); return true;
        case 'pb': { const b = popBtns[Number(el.dataset.i)]; if (b && b.fn) b.fn(); return true; }
        case 'ovclose': closeOv(); return true;
        case 'ovbg': if (ev.target === el) { if (ui.ov && ui.ov.kind === 'summary') closeSummary(); else closeOv(); } return true;
        case 'sum-detail': ui.sumDetail = !ui.sumDetail; { const o = $('lvOv'); if (o) delete o.dataset.sum; } renderSummary(); return true;
        case 'sum-close': closeSummary(); return true;
        case 'sum': ui.sumOpen = true; renderSummary(); return true;
        case 'card': {   // เปิดการ์ดเดียวต่อครั้ง; แตะตัวเปิดซ้ำ = ย่อ
          const L = cur(), open = expandedId(L), it = itemById(id); if (!it) return true;
          ui.exId = String(open) === String(id) ? 'none' : id; renderList(); return true;
        }
        case 'copy': { const it = itemById(id); if (it) copyOf(it); return true; }
        case 'google': { const it = itemById(id); if (it) googleOf(it); return true; }
        case 'ecard': ui.editOpen = ui.editOpen === id ? null : id; renderList(); return true;
        case 'up': if (D) { const nl = opMove(D, id, -1); if (nl) change(nl); } return true;
        case 'down': if (D) { const nl = opMove(D, id, 1); if (nl) change(nl); } return true;
        case 'del': removeItem(id, 'del'); return true;
        case 'skipto': if (D) { const nl = opSkipTo(D, id); if (nl) change(nl); else lshToast('เพลงนี้ถัดจากเพลงที่เล่นอยู่แล้ว', 'warn'); } return true;
        case 'moveset': openMoveSet(id); return true;
        case 'restore': if (D) { const nl = opRestore(D, id); if (nl) change(nl); } return true;
        // แทรกเพลง
        case 'instab': if (ui.ov && ui.ov.kind === 'insert') { ui.ov.tab = el.dataset.t; renderInsert(); } return true;
        case 'inskey': if (ui.ov && ui.ov.kind === 'insert') { ui.ov.k = el.dataset.k || ''; renderInsert(); } return true;
        case 'reshuffle': renderInsert(); return true;
        case 'inspick': { const s = JSON.parse(el.dataset.s); chooseInsert(s, el.dataset.k === 'request' ? 'request' : 'custom', el.dataset.k === 'request' ? s.id : null, null); return true; }
        case 'reqdel': { const rid = el.dataset.id; pop('ลบคำขอนี้?', '', [{ t: 'ลบ', c: 'warn', fn: () => { try { db.ref('rooms/' + room + '/requestStats/' + rid).remove(); } catch (e) {} closeOv(); openInsert(); if (ui.ov) { ui.ov.tab = 'req'; renderInsert(); } } }, { t: 'ยกเลิก', fn: () => { closeOv(); openInsert(); } }]); return true; }
        case 'pospick': { if (!posCtx) return true; const x = posItems[Number(el.dataset.i)], c = posCtx; closeOv(); if (x) { placeSong(c.o, x.id, c.reqId); if (c.after) c.after(); } return true; }
        // ลูกค้าขอเพลง
        case 'rqpos': { const x = rqItems[Number(el.dataset.i)]; if (!x || !reqCtx) return true; const c = reqCtx; closeOv(); c.rec(false); placeSong(songObj(c.s, 'request'), x.id, null); return true; }
        case 'keypop': { const it = itemById(id); if (!it || !D) return true; const rr = root.getBoundingClientRect(), r = el.getBoundingClientRect(), KP = window.lshKeyPick;
          if (!KP) { lshToast('ต้องอัปเดตแอปก่อน: ปิดแอปแล้วเปิดใหม่ (ไฟล์ index.html ยังเป็นรุ่นเก่า)', 'error'); return true; }
          const mk = (ori) => KP.html({ ori: ori, band: KP.bandOf(it), cur: keyOf(it), color: setCls(it), attr: 'data-a="keyset" data-id="' + esc(id) + '"' }), below = r.bottom - rr.top + 6, up = (rr.height - below) < 340;
          showOv('<div class="lv-kpop" id="lvKpop" data-a="stop-prop" style="right:' + Math.max(8, rr.right - r.right) + 'px;' + (up ? 'bottom:' + (rr.bottom - r.top + 6) + 'px' : 'top:' + below + 'px') + '">' + mk(KP.origCached(it) || '') + '</div>', 'pov', 'keypop');
          if (KP.origCached(it) === undefined) KP.origLoad(it).then((o) => { const box = $('lvKpop'); if (box && ui.ov && ui.ov.kind === 'keypop' && o) box.innerHTML = mk(o); });   // ต้นฉบับโหลดทีหลัง: เติมตัวเลขเมื่อมาถึง
          return true; }
        case 'keyset': { const nl = D ? opKey(D, id, el.dataset.k) : null; closeOv(); if (nl) change(nl); return true; }
        case 'reqpick': reqPopup(JSON.parse(el.dataset.s)); return true;
        case 'reqok': { const v = (($('lvReqQ') || {}).value || '').trim(); if (v) reqPopup({ id: '-', title: v, artist: '-', key: '-', bpm: '-' }); return true; }
      }
      return false;
    }
    function onChange(ev) {
      const t = ev.target;
    }
    function onInput(ev) {
      const t = ev.target; if (!t || !ui.ov) return;
      if (t.id === 'lvInsQ' && ui.ov.kind === 'insert') { ui.ov.q = t.value; renderInsert(); }
      else if (t.id === 'lvReqQ' && ui.ov.kind === 'req') { ui.ov.q = t.value; clearTimeout(timers.rq); timers.rq = setTimeout(renderReqBody, 120); }
    }
    function onKey(ev) { if (ev.key === 'Enter' && ev.target && ev.target.id === 'lvReqQ') { ev.preventDefault(); act('reqok', ev.target, null, ev); } }
    root.addEventListener('click', onClick); root.addEventListener('change', onChange); root.addEventListener('input', onInput); root.addEventListener('keydown', onKey);


    // ===== ลากเพลงจากชีตแทรก (คลัง/ลูกค้าขอ) ลงคิว: กดค้างที่แถวเพลงแล้วลากไปวางระหว่างการ์ด · ปล่อยที่กรอบล่างหรือนอกคิว = ยกเลิก =====
    let dg = null, dgSwallow = false;
    function dgCleanup() {
      if (!dg) return; clearTimeout(dg.timer); clearInterval(dg.scr);
      [dg.ghost, dg.line, dg.zone].forEach((e) => { if (e && e.parentNode) e.parentNode.removeChild(e); });
      const ov = document.querySelector('#lvOv .lv-ov'); if (ov) ov.classList.remove('dragging');
      dg = null;
    }
    function dgTarget(y) {   // หาตำแหน่งวาง: คืน {afterId, lineY} ตามเส้นกึ่งกลางของการ์ดที่ย้ายได้
      const box = $('lvSort'); if (!box || !D) return null;
      const kids = Array.from(box.children).filter((c) => c.classList && c.classList.contains('mv')), pl = playingOf(D);
      let prev = pl ? pl.id : null, lineY = null;
      for (let i = 0; i < kids.length; i++) { const r = kids[i].getBoundingClientRect(); if (y < r.top + r.height / 2) { lineY = r.top - 4; return { afterId: prev, lineY: lineY }; } prev = kids[i].dataset.id; lineY = r.bottom + 4; }
      if (lineY === null) { const r = box.getBoundingClientRect(); lineY = r.top; }
      return { afterId: prev, lineY: lineY };
    }
    function dgActivate() {
      if (!dg || dg.active) return; dg.active = true; dgSwallow = true;
      const ov = document.querySelector('#lvOv .lv-ov'); if (ov) ov.classList.add('dragging');
      const g = document.createElement('div'); g.className = 'lv-dghost'; g.innerHTML = '<b>' + esc(dg.s.title) + '</b><span>' + esc(dg.s.artist && dg.s.artist !== '-' ? dg.s.artist : '') + '</span>';
      const l = document.createElement('div'); l.className = 'lv-dline'; l.style.display = 'none';
      const sc = $('lvScroll').getBoundingClientRect(), z = document.createElement('div'); z.className = 'lv-dzone'; z.textContent = 'ลากมาปล่อยตรงนี้เพื่อยกเลิก';
      z.style.left = (sc.left + 16) + 'px'; z.style.width = (sc.width - 32) + 'px'; z.style.top = (sc.bottom - 76) + 'px';
      document.body.appendChild(l); document.body.appendChild(z); document.body.appendChild(g); dg.ghost = g; dg.line = l; dg.zone = z; dg.sc = sc;
      dg.scr = setInterval(() => { const s = $('lvScroll'); if (!s || !dg) return; const r = s.getBoundingClientRect(); if (dg.y < r.top + 80) s.scrollTop -= 14; else if (dg.y > r.bottom - 150 && dg.y < r.bottom - 80) s.scrollTop += 14; dgMove(); }, 30);
      dgMove();
    }
    function dgMove() {
      if (!dg || !dg.active) return; const x = dg.x, y = dg.y;
      dg.ghost.style.left = (x - dg.ghost.offsetWidth / 2) + 'px'; dg.ghost.style.top = (y - 28) + 'px';
      const sc = $('lvScroll').getBoundingClientRect(), cancel = y > sc.bottom - 80 || y < sc.top || x < sc.left || x > sc.right;
      dg.zone.classList.toggle('on', cancel); dg.cancel = cancel;
      if (cancel) { dg.line.style.display = 'none'; dg.t = null; return; }
      dg.t = dgTarget(y); if (!dg.t) { dg.line.style.display = 'none'; return; }
      dg.line.style.display = ''; dg.line.style.top = dg.t.lineY + 'px'; dg.line.style.left = (sc.left + 12) + 'px'; dg.line.style.width = (sc.width - 24) + 'px';
    }
    function dgDown(ev) {
      if (!D || !ui.ov || ui.ov.kind !== 'insert' || dg || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
      const row = ev.target.closest && ev.target.closest('.lv-row[data-a="inspick"]'); if (!row) return;
      let s; try { s = JSON.parse(row.dataset.s); } catch (e) { return; }
      dg = { s: s, kind: row.dataset.k === 'request' ? 'request' : 'custom', x: ev.clientX, y: ev.clientY, x0: ev.clientX, y0: ev.clientY, active: false, mouse: ev.pointerType === 'mouse' };
      dg.timer = setTimeout(() => { if (dg && !dg.active) dgActivate(); }, 320);
    }
    function dgMoveEv(ev) {
      if (!dg) return; dg.x = ev.clientX; dg.y = ev.clientY;
      if (!dg.active) { if (Math.hypot(dg.x - dg.x0, dg.y - dg.y0) > 8) { if (dg.mouse) dgActivate(); else dgCleanup(); } return; }   // นิ้ว: ขยับก่อนกดค้างครบ = กำลังเลื่อนรายการ
      dgMove();
    }
    function dgUp() {
      if (!dg) return; const d = dg; clearTimeout(d.timer);
      if (d.active) {
        const t = d.cancel ? null : d.t; dgCleanup(); setTimeout(() => { dgSwallow = false; }, 60);
        if (t && D) { placeSong(songObj(d.s, d.kind), t.afterId, d.kind === 'request' ? d.s.id : null); lshToast('วางในคิวแล้ว (ยังไม่ได้บันทึก)', 'ok'); }
        if (ui.ov && ui.ov.kind === 'insert') renderInsert();
      } else dgCleanup();
    }
    const dgTouch = (ev) => { if (dg && dg.active && ev.cancelable) ev.preventDefault(); };
    const dgCtx = (ev) => { if (dg) ev.preventDefault(); };
    const dgSw = (ev) => { if (dgSwallow) { dgSwallow = false; ev.stopPropagation(); ev.preventDefault(); } };
    root.addEventListener('click', dgSw, true); root.addEventListener('pointerdown', dgDown); root.addEventListener('contextmenu', dgCtx);
    window.addEventListener('pointermove', dgMoveEv); window.addEventListener('pointerup', dgUp); window.addEventListener('pointercancel', dgCleanup);
    document.addEventListener('touchmove', dgTouch, { passive: false });

    // หมุนจอ: วาดหน้าแนวนอน/แนวตั้งใหม่
    const landMq = window.matchMedia ? window.matchMedia(LAND_MQ) : null, onLandMq = () => { ui.landKey = null; ui.landOpen = false; render(); };
    if (landMq && landMq.addEventListener) landMq.addEventListener('change', onLandMq);

    // ===== เริ่ม / ปิดหน้า =====
    window.__lv = {
      onTimer: onTimer,
      autoTick: () => { if (!disposed) { updateProg(); renderStrip(); } },
      dispose: () => {
        try { if (pending && !pending.sending) commitPending(); if (D && ui.dirty && !ui.saving && !nextWarn()) doSave(); } catch (e) {}   // ส่งสิ่งที่ค้างก่อนออกจากหน้า
        dgCleanup(); try { root.removeEventListener('click', dgSw, true); root.removeEventListener('pointerdown', dgDown); root.removeEventListener('contextmenu', dgCtx); window.removeEventListener('pointermove', dgMoveEv); window.removeEventListener('pointerup', dgUp); window.removeEventListener('pointercancel', dgCleanup); document.removeEventListener('touchmove', dgTouch); } catch (e) {}
        try { if (landMq && landMq.removeEventListener) landMq.removeEventListener('change', onLandMq); } catch (e) {}
        disposed = true; subs.forEach((f) => { try { f(); } catch (e) {} });
        Object.keys(timers).forEach((k) => clearTimeout(timers[k])); clearInterval(timers.tick);
        if (pending) clearTimeout(pending.timer);
        try { root.removeEventListener('click', onClick); root.removeEventListener('change', onChange); root.removeEventListener('input', onInput); root.removeEventListener('keydown', onKey); } catch (e) {}
        window.__lv = null;
      }
    };
    // ปุ่ม "สรุปโชว์" ที่แถบเมื่อจบแล้ว ใช้ data-a="sum" ผ่านตัวกลางเดียวกัน
    // รับคำขอจากหน้ามอนิเตอร์: เปิดการ์ดเพลงที่ระบุ
    const rq = window.__lshExpandReq; window.__lshExpandReq = null;
    if (rq && rq.qid) { ui.exId = rq.mode === 'none' ? 'none' : rq.qid; }
    bind();
    render();
  };
  window.initLivePageModule();
</script>
