<link rel="stylesheet" href="style.css">
<style>
/* ===== ท็อคแบค 2.0 ===== */
/* คำสั่งด่วน: ขอบตามสีที่ตั้ง ตัวหนังสือขาว พื้นดำ ปุ่มสูงขึ้น */
body .tb-main-content .btn-quick, body .tb-main-content .btn-quick[style*="--qc"] { height: 64px; min-height: 64px; border-radius: 14px; font-size: 15px; font-weight: 700; color: #fff; background: #000; border: 1.5px solid var(--qc, #5a6272); }
body .tb-main-content .btn-quick:active, body .tb-main-content .btn-quick[style*="--qc"]:active { background: color-mix(in srgb, var(--qc, #5a6272) 28%, #000); transform: scale(.97); }
/* แถบ Telegram: ก่อนเริ่มโชว์เป็นแถวสวิตช์ · เริ่มโชว์แล้วย่อเหลือลูกศร */
#tgBar .tg-tab { display: none; }
#tgBar.tg-collapsed { padding: 0 !important; border: 0 !important; background: none !important; box-shadow: none !important; justify-content: center; min-height: 0; margin: -14px 0 -8px; }
#tgBar.tg-collapsed .tg-info, #tgBar.tg-collapsed .switch { display: none; }
#tgBar.tg-collapsed .tg-tab { display: flex; align-items: center; justify-content: center; width: 46px; height: 22px; padding: 0; border-radius: 0 0 12px 12px; border: 1px solid #2a303c; border-top: 0; background: var(--surface); color: #8a93a3; cursor: pointer; }
#tgBar.tg-collapsed .tg-tab .ic { width: 18px; height: 18px; }
#tgBar.tg-collapsed[data-tg="on"] .tg-tab { border-color: #1f6b5c; background: #0f2a26; color: #35e6c0; }
#tgBar.tg-collapsed[data-tg="none"] .tg-tab { border-color: #6b2f2f; background: #2a1517; color: #ff8d8d; }
/* ฟีล / ตัดเพลง: ชิป 12 ปุ่ม 4×3 ย่อ/ขยายได้ (ขยายค้างจนกว่าจะกดย่อเอง) */
.feel-wrap { flex: 1; min-width: 0; }
.feel-head { width: 100%; height: 32px; padding: 0; border: 0; background: none; color: var(--text); display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
.feel-head i { font-style: normal; font-weight: 400; color: var(--text-3); }
.feel-head .ic { width: 18px; height: 18px; color: var(--text-3); transform: rotate(180deg); transition: transform .2s; }
.feel-wrap.folded .feel-head .ic { transform: none; }
.feel-chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.feel-wrap.folded .feel-chips { display: none; }
.feel-chip { display: flex; align-items: center; justify-content: center; gap: 5px; height: 44px; min-width: 0; padding: 0 4px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); font-family: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.feel-chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--gc, #5b7cff); }
.feel-chip[data-g="s"] { --gc: #f5a524; } .feel-chip[data-g="c"] { --gc: #ff4fa8; } .feel-chip[data-g="y"] { --gc: #b084ff; }
.feel-chip:active { transform: scale(.96); background: var(--live); border-color: var(--live); color: var(--live-ink); }
/* ===== แนวนอน: 2 หน้า (คำสั่งด่วน / ฟีล-ตัดเพลง) สลับด้วยแถบบนหรือปัดซ้าย-ขวา ===== */
.land-tabs { display: none; }
.feel-chip .q-hint { display: none; }
@media (orientation: landscape) and (max-height: 640px) {
  body.lsh-page-talkback .land-tabs { display: flex; order: -1; flex: none; gap: 4px; padding: 4px; margin-bottom: 10px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line-strong); }
  body.lsh-page-talkback .land-tabs button { flex: 1; height: 38px; border: 0; border-radius: 10px; background: transparent; color: var(--text-3); font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  body.lsh-page-talkback .land-tabs button.on { background: var(--surface-3); color: var(--text); box-shadow: 0 0 0 1px var(--line-strong) inset; }
  body.lsh-page-talkback .tb-main-content { touch-action: pan-y; }
  body.lsh-page-talkback .tb-main-content.land-feel > div:nth-child(2) { display: none !important; }
  body.lsh-page-talkback .tb-main-content.land-feel .action-row { display: flex !important; flex: 1; min-height: 0; padding: 0; margin: 0; }
  body.lsh-page-talkback .feel-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  body.lsh-page-talkback .feel-head { display: none; }
  body.lsh-page-talkback .feel-wrap.folded .feel-chips, body.lsh-page-talkback .feel-chips { display: grid !important; flex: 1; min-height: 0; margin: 0; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 12px; }
  body.lsh-page-talkback .feel-chip { position: relative; overflow: hidden; height: auto; flex-direction: column; border-radius: 16px; background: #000; color: #fff; border: 1.5px solid var(--gc, #5b7cff); font-size: clamp(15px, 4.6vh, 24px); font-weight: 700; gap: 2px; line-height: 1.2; transition: transform .18s var(--ease), box-shadow .18s; }
  body.lsh-page-talkback .feel-chip::before { display: none; }
  body.lsh-page-talkback .feel-chip .q-hint { font-size: 12px; font-weight: 600; opacity: .9; }
  body.lsh-page-talkback .feel-chip.armed { transform: scale(1.05); z-index: 2; box-shadow: 0 0 0 3px var(--gc), 0 10px 28px rgba(0,0,0,.55); }
  body.lsh-page-talkback .feel-chip.armed .q-hint, body.lsh-page-talkback .feel-chip.sent .q-hint { display: block; }
  body.lsh-page-talkback .feel-chip.armed::after { content: ''; position: absolute; left: 0; bottom: 0; height: 5px; width: 100%; background: var(--gc); transform-origin: left; animation: qArm 3s linear forwards; }
  body.lsh-page-talkback .feel-chip.sent { background: var(--live) !important; color: var(--live-ink) !important; border-color: var(--live) !important; }
}
</style>
<!-- Top Bar (10%) -->
<div class="tb-top-bar">
  <div class="top-box">
    <div class="top-head">
      <span class="top-title"><i class="tb-dot-red"></i>ท็อคแบคล่าสุด</span>
      <span id="tbTopSender" class="top-sender"></span>
    </div>
    <div id="tbTopTalkback" class="top-content">รอคำสั่ง...</div>
  </div>
  <div class="top-box" id="tbTopNextBox">
    <span class="top-title">เพลงถัดไป</span>
    <div id="tbTopNext" class="top-content">-</div>
  </div>
</div>

<!-- Main Content Area (62%) -->
<div class="tb-main-content">
  <!-- 1. Telegram Switch -->
  <div class="tg-control-card" id="tgBar" data-tg="none">
    <button type="button" class="tg-tab" id="tgTab" aria-label="แสดงสวิตช์ส่งแจ้งเตือน Telegram"><svg class="ic" aria-hidden="true"><use href="#i-chev-down"/></svg></button>
    <div class="tg-info">
      <div class="tg-title"><svg class="ic tg-ic" aria-hidden="true"><use href="#i-send"/></svg> ส่งแจ้งเตือนเข้า Telegram</div>
      <div id="tgStatusText" class="tg-status">กำลังตรวจสอบการเชื่อมต่อ...</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="tgToggle" disabled>
      <span class="slider"></span>
    </label>
  </div>

  <!-- 2. Quick Talkback Grid -->
  <div>
    <div class="section-title"><svg class="ic" aria-hidden="true"><use href="#i-bolt"/></svg> คำสั่งด่วน</div>
    <div class="quick-grid" id="quickButtonsContainer"></div>
    <div id="quickLimitNotice" style="font-size:10px;color:#888;margin-top:4px;text-align:right">
      * เพิ่ม/แก้ไขคำสั่งด่วนได้สูงสุด 6 ปุ่ม
    </div>
  </div>

  <!-- 2.0: แถบสลับหน้าแนวนอน (แสดงเฉพาะแนวนอน) -->
  <div class="land-tabs" id="tbLandTabs" role="tablist">
    <button type="button" role="tab" class="on" data-p="quick" aria-selected="true">คำสั่งด่วน</button>
    <button type="button" role="tab" data-p="feel" aria-selected="false">ฟีล/ตัดเพลง</button>
  </div>

  <!-- 3 & 4. Action Row -->
  <div class="action-row">
    <div class="feel-wrap" id="feelWrap">
      <button type="button" class="feel-head" id="btnFeelFold" aria-expanded="true"><span>ฟีล / ตัดเพลง <i>· 12 ปุ่ม</i></span><svg class="ic" aria-hidden="true"><use href="#i-chev-down"/></svg></button>
      <div class="feel-chips" id="feelChips">
        <button type="button" class="btn-feel-item feel-chip" data-g="t" data-act="เร่งจังหวะขึ้น">เร็วขึ้น</button>
        <button type="button" class="btn-feel-item feel-chip" data-g="t" data-act="ผ่อนจังหวะลง">ช้าลง</button>
        <button type="button" class="btn-feel-item feel-chip" data-g="s" data-act="จบเพลงหลังท่อนนี้">ตัดจบ</button>
        <button type="button" class="btn-feel-item feel-chip" data-g="s" data-act="ซ้ำท่อนฮุคอีก 1 รอบ">ซ้ำฮุค</button>
        <button type="button" class="btn-feel-item feel-chip" data-g="s" data-act="ยืดโซโล่ต่ออีก 1 รอบ">ยืดโซโล่</button>
        <button type="button" class="btn-feel-item feel-chip" data-g="s" data-act="ข้ามไปท่อนฮุคสุดท้าย">ฮุคสุดท้าย</button>
        <button type="button" class="btn-feel-item feel-chip" data-g="s" data-act="ท่อนต่อไปเล่นเบรคดาวน์">เบรคดาวน์</button>
        <button type="button" class="btn-feel-item feel-chip" data-g="c" data-act="ท่อนต่อไปให้ลูกค้าร้อง">ลูกค้าร้อง</button>
        <button type="button" class="btn-feel-item feel-chip" data-g="y" data-act="ย้ำกระเดื่อง วนคอร์ดท่อนฮุค">กระเดื่อง</button>
        <button type="button" class="btn-feel-item feel-chip" data-g="y" data-act="ท่อนต่อไปเล่นสามช่า">สามช่า</button>
        <button type="button" class="btn-feel-item feel-chip" data-g="y" data-act="ท่อนต่อไปเล่นดิสโก้">ดิสโก้</button>
        <button type="button" class="btn-feel-item feel-chip" data-g="y" data-act="ท่อนต่อไปเล่นเร็กเก้">เร็กเก้</button>
      </div>
    </div>
    <button class="btn-action-main btn-feel" id="btnOpenFeel" hidden style="display:none" aria-hidden="true" tabindex="-1"><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg> ตัดเพลง / เปลี่ยนฟีล</button>
    <button class="btn-action-main btn-request" id="btnOpenRequest" hidden style="display:none" aria-hidden="true" tabindex="-1"><svg class="ic" aria-hidden="true"><use href="#i-inbox"/></svg> ลูกค้าขอเพลง</button>
  </div>

  <!-- 5. Chat Display Box -->
  <div>
    <div class="section-title" style="margin-bottom:6px">ห้องแชต</div>
    <div class="chat-container" id="chatBox"></div>
  </div>
</div>

<!-- Bottom Control Bar (8%) Sticky -->
<div class="tb-bottom-bar" id="bottomControlBar">
  <input type="text" id="talkbackInput" class="tb-input" placeholder="พิมพ์ข้อความท็อคแบค">
  <button class="btn-send" id="btnSendTalkback">ส่ง</button>
</div>

<!-- Popup: ตัดเพลง / เปลี่ยนฟีล (เพิ่ม onclick ปิดเมื่อแตะพื้นที่ภายนอก) -->
<div id="feelModal" class="modal-overlay hidden" style="display:none" onclick="closeFeelModal(event)">
  <div class="feel-popup" onclick="event.stopPropagation()">
    <div class="modal-title modal-head">
      <svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg> สั่งงานด่วน: ตัดเพลง / เปลี่ยนฟีล
    </div>
    <!-- 2.0: ปุ่มฟีลย้ายไปเป็นชิป 12 ปุ่มในหน้า (#feelChips) ป๊อปอัปนี้ไม่ถูกเปิดแล้ว เก็บ ID ไว้ก่อน -->
    <button id="btnCancelFeel" class="btn-ghost">ยกเลิก</button>
  </div>
</div>

<!-- Modal: ลูกค้าขอเพลง (เพิ่ม onclick="closeRequestModal(event)" ที่คอนเทนเนอร์หลัก) -->
<!-- 2.0: ย้ายการรับคำขอเพลงไปหน้า Live แล้ว (ปุ่ม/หน้าต่างนี้ซ่อนไว้ ยังไม่ลบ) -->
<div id="requestModal" class="request-modal-container hidden" style="display:none" onclick="closeRequestModal(event)">
  <div class="request-modal-content" onclick="event.stopPropagation()">
    <div class="u-between">
      <span class="modal-title" style="margin:0;color:var(--request)"><svg class="ic" aria-hidden="true"><use href="#i-inbox"/></svg> ลูกค้าขอเพลง</span>
      <button id="btnCloseRequestModal" style="background:none;border:none;color:#aaa;font-size:20px;cursor:pointer"><svg class="ic ic-solo" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="search-row">
      <input type="text" id="reqSearchInput" placeholder="พิมพ์ชื่อเพลง หรือศิลปิน...">
      <button class="btn-check" id="btnApplyReqSong"><svg class="ic ic-solo" aria-hidden="true"><use href="#i-check"/></svg></button>
    </div>
    <div id="reqPreview" class="search-row hidden" style="align-items:stretch">
      <div id="reqPreviewText" style="flex:1;min-width:0;display:flex;align-items:center;padding:8px 14px;background:var(--bg);border:1px solid var(--request);border-radius:var(--r-md);font-size:15px;font-weight:700;color:var(--request);overflow:hidden;text-overflow:ellipsis"></div>
      <button class="btn-check" id="btnSendReqSong" title="ส่ง"><svg class="ic ic-solo" aria-hidden="true"><use href="#i-send"/></svg></button>
    </div>
    <div class="db-song-list" id="reqDbList"></div>
  </div>
</div>

<script>
  window.initTalkbackPageModule = function() {
    let currentUser = null;
    let selectedRoom = '';
    let botToken = null;
    let chatId = null;
    let isTgEnabled = false;
    let allDbSongs = [];
    let selectedReqSongObj = null;

    try {
      const sessionStr = localStorage.getItem('lsh_session');
      currentUser = sessionStr ? JSON.parse(sessionStr) : { nickname: 'OatSim', role: 'member', emoji: '😎', username: 'oat' };
      let rawRoom = (currentUser && currentUser.room) || localStorage.getItem('lsh_selected_room') || '';
      selectedRoom = rawRoom.trim();
    } catch(e) {
      currentUser = { nickname: 'สมาชิก', role: 'guest', emoji: '🎵', username: 'guest' };
      selectedRoom = '';
    }
    if (!selectedRoom) { lshRoom(null); return; } // ไม่พบห้อง: ไม่เขียนข้อมูลใดๆ และกลับไปหน้าเลือกห้อง

    function initTelegramConfig() {
      const tgStatus = document.getElementById('tgStatusText');
      const tgToggle = document.getElementById('tgToggle');
      if (!tgStatus || !tgToggle) return;

      if (typeof db !== 'undefined') {
        db.ref(`roomConfig/${selectedRoom}`).on('value', (snapshot) => {
          const cfg = snapshot.val() || {};
          botToken = cfg.BotToken;
          chatId = cfg.ChatID;

          if (botToken && chatId) {
            tgStatus.innerText = `พร้อมใช้งาน (ห้อง ${selectedRoom})`;
            tgStatus.style.color = '#00f2d1';
            tgToggle.disabled = false;
          } else {
            tgStatus.innerText = `ห้อง ${selectedRoom} ยังไม่ได้ตั้งค่า BotToken/ChatID`;
            tgStatus.style.color = '#ef4444';
            tgToggle.disabled = true;
            tgToggle.checked = false;
            isTgEnabled = false;
          }
        });
      }
    }

    function initQuickCommands() {
      const defaultBtns = [
        { name: 'ขอเวลานอก', action: 'ขอเวลานอกสักแป๊บครับ', color: '#5a6272' },
        { name: 'ขอข้ามเพลงถัดไป', action: 'เพลงถัดไปยังไม่พร้อมครับ ขอข้ามก่อน', color: '#5a6272' },
        { name: 'เพลงนี้คีย์อะไร', action: 'เพลงนี้เล่นคีย์อะไร?', color: '#5a6272' },
        { name: 'นับให้หน่อย', action: 'ช่วยนับขึ้นเพลงให้หน่อย', color: '#5a6272' }
      ];

      const isMember = currentUser && currentUser.role !== 'guest';
      const notice = document.getElementById('quickLimitNotice');

      if (!isMember) {
        if (notice) notice.style.display = 'none';
        renderQuickButtons(defaultBtns);
      } else if (typeof db !== 'undefined') {
        if (notice) notice.style.display = 'block';
        db.ref(`users/${currentUser.username}/talkbackCommands`).on('value', (snap) => {
          const cmds = snap.val() || [];
          let customBtns = [];
          for (let i = 0; i < 6; i++) {
            if (cmds[i] && cmds[i].name && cmds[i].action) {
              customBtns.push(cmds[i]);
            }
          }
          renderQuickButtons(customBtns.length > 0 ? customBtns : defaultBtns);
        });
      }
    }

    function renderQuickButtons(buttons) {
      const container = document.getElementById('quickButtonsContainer');
      if (!container) return;
      container.innerHTML = '';
      buttons.forEach(btn => {
        const b = document.createElement('button');
        b.className = 'btn-quick';
        if (btn.color) b.style.setProperty('--qc', btn.color); // สีตามที่ตั้งไว้: ย้อมพื้นและขอบ
        b.innerText = btn.name;
        const hint = document.createElement('span'); hint.className = 'q-hint'; hint.textContent = 'แตะอีกครั้งเพื่อส่ง'; b.appendChild(hint);
        b.onclick = () => (isLandscapeQuick() ? landQuickTap(b, btn) : setInputValue(btn.action));
        container.appendChild(b);
      });
      container.dataset.n = String(buttons.length);
      container.style.setProperty('--qn', String(Math.max(1, Math.min(buttons.length, 3))));
    }

    // ===== แนวนอน: ใช้ได้เฉพาะคำสั่งด่วน — แตะครั้งแรกขยาย แตะซ้ำภายใน 3 วินาทีถึงส่ง แล้วกลับมอนิเตอร์ =====
    const LAND_MQ = '(orientation: landscape) and (max-height: 640px)';
    function isLandscapeQuick() { return window.matchMedia && window.matchMedia(LAND_MQ).matches; }
    let armedBtn = null, armTimer = null;
    function disarmQuick() {
      clearTimeout(armTimer); armTimer = null;
      if (armedBtn) { armedBtn.classList.remove('armed'); armedBtn = null; }
    }
    window.__tbDisarm = disarmQuick;
    if (!window.__tbOrientBound && window.matchMedia) {
      window.__tbOrientBound = true;
      window.matchMedia(LAND_MQ).addEventListener('change', () => { if (window.__tbDisarm) window.__tbDisarm(); });
    }
    function landMsg(t) {
      let m = document.getElementById('tbLandMsg');
      if (!m) { m = document.createElement('div'); m.id = 'tbLandMsg'; document.body.appendChild(m); }
      m.textContent = t; m.classList.add('on');
      clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove('on'), 3500);
    }
    async function landQuickTap(b, btn) {
      if (armedBtn === b) {                       // แตะซ้ำ = ส่งจริง
        disarmQuick();
        if (navigator.onLine === false) { landMsg('ส่งไม่สำเร็จ: ไม่มีอินเทอร์เน็ต'); return; }
        try {
          setInputValue(btn.action);
          await sendTalkback();                   // ใช้เส้นทางส่งเดิมของหน้านี้ทุกอย่าง
        } catch (e) { landMsg('ส่งไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
        b.classList.add('sent');
        const h = b.querySelector('.q-hint'); if (h) h.textContent = 'ส่งแล้ว';
        setTimeout(() => { if (typeof setActiveNav === 'function') setActiveNav('monitor'); }, 450);
        return;
      }
      disarmQuick();                              // ปุ่มอื่นเด้งแทน
      armedBtn = b; b.classList.remove('armed'); void b.offsetWidth; b.classList.add('armed');
      armTimer = setTimeout(disarmQuick, 3000);   // ไม่แตะซ้ำใน 3 วินาที = กลับขนาดเดิม
    }

    function setInputValue(text) {
      const input = document.getElementById('talkbackInput');
      if (input) {
        input.value = text; // ไม่สั่งโฟกัส: ไม่เปิดคีย์บอร์ดโดยไม่ตั้งใจ
      }
    }

    function initDbSongs() {
      if (typeof db !== 'undefined') {
        db.ref('songs').on('value', (snap) => {
          const data = snap.val() || {};
          allDbSongs = Object.keys(data).map(k => ({ id: k, ...data[k] }));
        });
      }
    }

    // 4. Actions: ลูกค้าขอเพลง (เพิ่ม Auto Focus)
    function openRequestModal() {
      document.getElementById('requestModal').classList.remove('hidden');
      const input = document.getElementById('reqSearchInput');
      input.value = '';
      document.getElementById('reqDbList').innerHTML = ''; // เคลียร์รายการ ไม่แสดงอะไรจนกว่าจะพิมพ์
      selectedReqSongObj = null;
      updateReqPreview();
      if (window.lshChordLookup && window.lshChordLookup.preload) window.lshChordLookup.preload();
      loadReqSuggest();

      // สั่ง Auto Focus ให้พิมพ์ได้ทันทีหลังหน้าต่างสไลด์ลงมา
      setTimeout(() => {
        input.focus();
      }, 100);
    }

    function closeRequestModal(e) {
      if (!e || e.target.id === 'requestModal' || e.target.id === 'btnCloseRequestModal') {
        document.getElementById('requestModal').classList.add('hidden');
      }
    }

    const reqEsc = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const reqLabel = (s) => (s.artist && s.artist !== '-') ? `${s.title} - ${s.artist}` : String(s.title || '');
    let reqSearchSeq = 0;      // กันผลค้นหาคลังคอร์ดที่มาช้าทับผลใหม่
    let reqSuggest = [];       // เพลงแนะนำจากประวัติรีเควสของร้านที่เล่นอยู่
    let reqSuggestSeq = 0;

    function pickReqSong(s) {
      document.getElementById('reqSearchInput').value = reqLabel(s);
      selectedReqSongObj = s;
      updateReqPreview();
    }

    function reqItem(html, onpick) {
      const div = document.createElement('div');
      div.className = 'db-song-item';
      div.innerHTML = html;
      div.onclick = onpick;
      return div;
    }

    function reqHead(text) {
      const d = document.createElement('div');
      d.style.cssText = 'font-size:11px;color:#888;padding:2px 4px;font-weight:700';
      d.textContent = text;
      return d;
    }

    // ชื่อร้านที่กำลังเล่น (ตัดวันที่ออกจากชื่อชุดลิสต์ — ตรรกะเดียวกับตอนบันทึกรีเควส)
    async function getVenueName() {
      const idSnap = await db.ref(`rooms/${selectedRoom}/queue/activeSetlistId`).once('value');
      const id = idSnap.val();
      if (!id || id === '-') return null;
      try {
        const v = (await db.ref(`rooms/${selectedRoom}/setlists/${id}/venue`).once('value')).val();
        return v ? v.split(/[-–—]/)[0].trim() : String(id).trim();
      } catch (e) { return String(id).trim(); }
    }

    // เพลงแนะนำ: ประวัติรีเควสของร้านนี้ เรียงตามจำนวนครั้งที่ถูกขอ (เท่ากันให้ขอล่าสุดขึ้นก่อน) สูงสุด 8
    async function loadReqSuggest() {
      const my = ++reqSuggestSeq;
      reqSuggest = [];
      try {
        if (typeof db === 'undefined') return;
        const venue = await getVenueName();
        if (!venue) { if (my === reqSuggestSeq) renderReqSuggest(); return; }
        const val = (await db.ref(`rooms/${selectedRoom}/request/${venue}`).once('value')).val() || {};
        if (my !== reqSuggestSeq) return;
        const N = (window.lshChordLookup && window.lshChordLookup._bulk) ? window.lshChordLookup._bulk.bkNorm : (x) => String(x || '').toLowerCase().replace(/\s+/g, '');
        const g = new Map();
        Object.keys(val).forEach(pk => {
          const r = val[pk] || {};
          if (!r.title) return;
          const k = N(r.title, true) + '|' + N(r.artist && r.artist !== '-' ? r.artist : '', true);
          let e = g.get(k);
          if (!e) g.set(k, e = { title: r.title, artist: r.artist || '-', songID: r.songID || '-', count: 0, last: '' });
          e.count++;
          const ord = String(r.date || '') + '|' + pk;
          if (ord > e.last) { e.last = ord; e.title = r.title; e.artist = r.artist || '-'; if (r.songID && r.songID !== '-') e.songID = r.songID; }
        });
        reqSuggest = [...g.values()].sort((x, y) => (y.count - x.count) || (y.last < x.last ? -1 : y.last > x.last ? 1 : 0)).slice(0, 8);
      } catch (e) { reqSuggest = []; }
      renderReqSuggest();
    }

    function renderReqSuggest() {
      const container = document.getElementById('reqDbList');
      if (!container || document.getElementById('reqSearchInput').value.trim() !== '') return;
      container.innerHTML = '';
      if (!reqSuggest.length) return;
      container.appendChild(reqHead('เพลงที่ลูกค้าร้านนี้มักขอ'));
      reqSuggest.forEach(r => {
        const inDb = (r.songID && r.songID !== '-') ? allDbSongs.find(x => x.id === r.songID) : null;
        const obj = inDb || { id: '-', title: r.title, artist: r.artist, key: '-', bpm: '-' };
        container.appendChild(reqItem(`<b>${reqEsc(r.title)}</b>${(r.artist && r.artist !== '-') ? ' - ' + reqEsc(r.artist) : ''} <span class="u-meta">(ขอ ${r.count} ครั้ง)</span>`, () => pickReqSong(obj)));
      });
    }

    // ค้นหาในคลังคอร์ด (ฐานข้อมูลรอง) เฉพาะเพลงที่ยังไม่อยู่ในรายชื่อเพลงทั้งหมด
    async function searchChordCatalog(kw, mainSet) {
      const L = window.lshChordLookup && window.lshChordLookup._bulk;
      if (!L) return null;
      const ix = await L.getIdx();
      const N = L.bkNorm, tq = N(kw, true);
      if (!tq) return [];
      const have = new Set(), haveBk = new Set();
      allDbSongs.forEach(x => { if (x.bk) haveBk.add(x.bk); have.add(N(x.title, true) + '|' + N(x.artist, true)); });
      const pre = [], con = [], art = [];
      for (let i = 0; i < ix.cat.length; i++) {
        const e = ix.cat[i];
        const tt = e._t != null ? e._t : (e._t = N(e[1], true));
        let bucket = null;
        if (tt && tt.indexOf(tq) === 0) bucket = pre; else if (tt && tt.indexOf(tq) > 0) bucket = con;
        else { const ta = e._a != null ? e._a : (e._a = N(e[2], true)); if (ta && ta.indexOf(tq) >= 0) bucket = art; }
        if (!bucket || bucket.length >= 10) continue;
        if (haveBk.has(e[0]) || have.has(tt + '|' + (e._a != null ? e._a : (e._a = N(e[2], true))))) continue;
        bucket.push(e);
        if (pre.length >= 10) break;
      }
      return [...pre, ...con, ...art].slice(0, 10);
    }

    function filterReqSongs() {
      const input = document.getElementById('reqSearchInput');
      const container = document.getElementById('reqDbList');
      if (!input || !container) return;

      const kw = input.value.toLowerCase().trim();
      const my = ++reqSearchSeq;

      // ยังไม่ได้พิมพ์อะไร → โชว์เพลงแนะนำจากประวัติรีเควสของร้าน
      if (kw === '') {
        renderReqSuggest();
        return;
      }

      // 3 ขั้น: ชื่อเพลงขึ้นต้นตรง → ชื่อเพลงมีคำนี้ → ชื่อศิลปินมีคำนี้ (เรียงตัวอักษรในแต่ละกลุ่ม)
      let prefixList = [], containsList = [], artistList = [];
      allDbSongs.forEach(s => {
        let t = (s.title || '').toLowerCase();
        let a = (s.artist || '').toLowerCase();
        if (t.startsWith(kw)) prefixList.push(s);
        else if (t.includes(kw)) containsList.push(s);
        else if (a.includes(kw)) artistList.push(s);
      });
      const byTitle = (x, y) => (x.title || '').localeCompare(y.title || '', 'th');

      let results = [...prefixList.sort(byTitle), ...containsList.sort(byTitle), ...artistList.sort(byTitle)].slice(0, 12);
      container.innerHTML = '';

      results.forEach(s => {
        container.appendChild(reqItem(`<b>${reqEsc(s.title)}</b> - ${reqEsc(s.artist)} <span class="u-meta">(${reqEsc(s.key || '-')})</span>`, () => pickReqSong(s)));
      });

      // ต่อท้ายด้วยเพลงจากคลังคอร์ดที่ยังไม่อยู่ในรายชื่อเพลงทั้งหมด (โหลดทีหลัง ไม่บล็อกผลด้านบน)
      const tail = document.createElement('div');
      container.appendChild(tail);
      const noHit = () => {
        if (!results.length) tail.innerHTML = '<div style="color:#666;font-size:11px;text-align:center;padding:12px">ไม่พบเพลงในระบบ (พิมพ์ชื่อเองแล้วกดส่งได้เลย)</div>';
        else tail.innerHTML = '';
      };
      if (!(window.lshChordLookup && window.lshChordLookup._bulk)) { noHit(); return; }
      tail.innerHTML = '<div style="color:#666;font-size:11px;text-align:center;padding:8px">กำลังค้นหาในคลังคอร์ด...</div>';
      searchChordCatalog(kw).then(rows => {
        if (my !== reqSearchSeq) return;
        if (!rows || !rows.length) { noHit(); return; }
        tail.innerHTML = '';
        tail.appendChild(reqHead('จากคลังคอร์ด (ยังไม่อยู่ในรายชื่อเพลงทั้งหมด)'));
        rows.forEach(e => {
          const obj = { id: '-', title: e[1], artist: e[2] || '-', key: e[3] || '-', bpm: e[5] || '-' };
          tail.appendChild(reqItem(`<b>${reqEsc(e[1])}</b>${e[2] ? ' - ' + reqEsc(e[2]) : ''} <span class="u-meta">(${reqEsc(e[3] || '-')})</span>`, () => pickReqSong(obj)));
        });
      }).catch(() => { if (my === reqSearchSeq) noHit(); });
    }

    // กล่องข้อความเตรียมส่งในหน้าต่างขอเพลง: โชว์ "ลูกค้าขอเพลง : <ข้อความในช่องค้นหา>" พร้อมปุ่มส่ง
    function updateReqPreview() {
      const val = document.getElementById('reqSearchInput').value.trim();
      const box = document.getElementById('reqPreview');
      if (!box) return;
      box.classList.toggle('hidden', !val);
      document.getElementById('reqPreviewText').textContent = val ? `ลูกค้าขอเพลง : ${val}` : '';
    }

    function onReqSearchInput() {
      const input = document.getElementById('reqSearchInput');
      // พิมพ์แก้ข้อความหลังเลือกเพลงแล้ว = ไม่ใช่เพลงที่เลือกแล้ว (กันส่งข้อมูลเพลงผิดตัว)
      if (selectedReqSongObj && input.value.trim() !== reqLabel(selectedReqSongObj)) {
        selectedReqSongObj = null;
      }
      filterReqSongs();
      updateReqPreview();
    }

    async function sendReqFromModal() {
      const val = document.getElementById('reqSearchInput').value.trim();
      if (!val) return;
      setInputValue(`ลูกค้าขอเพลง : ${val}`);
      await sendTalkback();   // ใช้เส้นทางส่งเดิมทั้งหมด (requestQueue / requestStats / สถิติร้าน)
      // ไม่ปิดหน้าต่าง: เผื่อลูกค้าเขียนมาหลายเพลง — ล้างช่องค้นหาแล้วรับเพลงถัดไปได้เลย
      const inp = document.getElementById('reqSearchInput');
      inp.value = '';
      updateReqPreview();
      renderReqSuggest();
      if (typeof lshToast === 'function') lshToast('ส่งคำขอเพลงแล้ว: ' + val, 'ok');
      setTimeout(loadReqSuggest, 1500);   // รอให้บันทึกประวัติร้านเสร็จ แล้วอัปเดตจำนวนครั้ง
      inp.focus();
    }

    function applyReqSongToInput() {
      const val = document.getElementById('reqSearchInput').value.trim();
      if (!val) return;

      // 1. ย้ายข้อความไปใส่ช่องท็อคแบคด้านล่าง
      setInputValue(`ลูกค้าขอเพลง : ${val}`);

      // 2. เคลียร์ช่องค้นหา + ปิด Modal ทันที (ยังไม่ push ลง Firebase)
      document.getElementById('reqSearchInput').value = '';
      document.getElementById('reqDbList').innerHTML = '';
      updateReqPreview();
      document.getElementById('requestModal').classList.add('hidden');
    }

    // 5. ส่งข้อความ Talkback (แก้ไขโครงสร้าง try...catch ให้ถูกต้องแล้วครับ)
    async function sendTalkback() {
      const input = document.getElementById('talkbackInput');
      if (!input || !input.value.trim()) return;

      const msgText = input.value.trim();
      const formattedMsg = `${currentUser.emoji || '🎵'} ${currentUser.nickname} : ${msgText}`;

      if (typeof db !== 'undefined') {
        // บันทึกเข้าห้องแชต Talkback เสมอ
        db.ref(`rooms/${selectedRoom}/talkbacks`).push({
          sender: currentUser.nickname,
          emoji: currentUser.emoji || '🎵',
          message: msgText,
          timestamp: Date.now()
        });
        db.ref(`rooms/${selectedRoom}/latestTalkback`).set(formattedMsg);

        // 📌 เช็กเฉพาะกรณี "ลูกค้าขอเพลง :" เท่านั้น ถึงจะ Push ลง Request Queue & Stats และบันทึกแยกตามชื่อร้าน
        if (msgText.startsWith('ลูกค้าขอเพลง :')) {
          const songNameOnly = msgText.replace('ลูกค้าขอเพลง :', '').trim();
          
          const reqItem = {
            id: 'req_' + Date.now(),
            title: selectedReqSongObj ? selectedReqSongObj.title : songNameOnly,
            artist: selectedReqSongObj ? selectedReqSongObj.artist : '-',
            key: selectedReqSongObj ? (selectedReqSongObj.key || '-') : '-',
            bpm: selectedReqSongObj ? (selectedReqSongObj.bpm || '-') : '-',
            status: 'request',
            timestamp: Date.now()
          };

          // บันทึกลง requestQueue ปกติ
          db.ref(`rooms/${selectedRoom}/queue/requestQueue`).push(reqItem);

          // บันทึกลง requestStats ปกติ
          const statsPayload = {
            title: reqItem.title,
            artist: selectedReqSongObj ? (selectedReqSongObj.artist || '-') : '-',
            key: selectedReqSongObj ? (selectedReqSongObj.key || '-') : '-',
            bpm: selectedReqSongObj ? (selectedReqSongObj.bpm || '-') : '-',
            songID: selectedReqSongObj ? (selectedReqSongObj.id || '-') : '-',
            time: Date.now()
          };
          db.ref(`rooms/${selectedRoom}/requestStats`).push(statsPayload);
          
          // 📌 ดึงชื่อร้านจากชุดลิสต์เพลงที่ใช้งานอยู่ เพื่อนำมาบันทึกสถิติแยกตามร้าน
          db.ref(`rooms/${selectedRoom}/queue/activeSetlistId`).once('value', async (snapSetlistId) => {
            const activeSetlistId = snapSetlistId.val();
            let venueName = 'ร้านทั่วไป'; // ค่าสำรองถ้ายังไม่ได้เลือกชุดลิสต์เพลง

            if (activeSetlistId && activeSetlistId !== '-') {
              try {
                const venueSnap = await db.ref(`rooms/${selectedRoom}/setlists/${activeSetlistId}/venue`).once('value');
                const rawVenue = venueSnap.val();
                if (rawVenue) {
                  // ตัดวันที่ออกจากชื่อลิสต์เพลง
                  venueName = rawVenue.split(/[-–—]/)[0].trim();
                } else {
                  venueName = activeSetlistId.trim();
                }
              } catch (err) {
                venueName = activeSetlistId.trim();
              }
            }

            // เตรียมข้อมูลสำหรับบันทึกสะสมในโหนด request ของร้านนั้นๆ (ใช้ Push Key)
            const venueRecord = {
              title: reqItem.title,
              artist: selectedReqSongObj ? (selectedReqSongObj.artist || '-') : '-',
              songID: selectedReqSongObj ? (selectedReqSongObj.id || '-') : '-',
              date: new Date().toISOString().split('T')[0] // วันที่ขอ (YYYY-MM-DD)
            };

            // บันทึกลงโหนด rooms/{selectedRoom}/request/{ชื่อร้าน}/ แบบ Push Key
            db.ref(`rooms/${selectedRoom}/request/${venueName}`).push(venueRecord);
          });

          // ล้างตัวแปรเก็บวัตถุเพลง
          selectedReqSongObj = null;
        }
      }

      // ส่งเข้า Telegram Bot (ถ้าเปิดใช้งานอยู่)
      if (isTgEnabled && botToken && chatId) {
        try {
          fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text: formattedMsg })
          });
        } catch(e) { console.error('Telegram Error:', e); }
      }

      input.value = '';
    }

    function listenRealtimeData() {
      if (typeof db === 'undefined') return;

      lshBindTopTalkback(selectedRoom, document.getElementById('tbTopTalkback'), document.getElementById('tbTopSender'));

      db.ref(`rooms/${selectedRoom}/queue/songs`).on('value', (snap) => {
        window.lshReady && window.lshReady();
        const songs = snap.val() || [];
        const nextSong = songs.find(s => s.status === 'next');
        const topNext = document.getElementById('tbTopNext');
        if (topNext) {
          topNext.innerText = nextSong ? ((nextSong.type === 'dummy_start' || nextSong.type === 'dummy_end') ? lshPlain(nextSong.title) : nextSong.title) : '-';
        }
        const tbBox = document.getElementById('tbTopNextBox');
        if (tbBox) tbBox.className = 'top-box' + (nextSong && nextSong.set ? ' set-color-' + nextSong.set.replace('Set ', '') : '');
        lshWatch(topNext, 'next');
      });

      // ดึงข้อมูลแชต Realtime และ Scroll ลงล่างสุดเสมอ
      db.ref(`rooms/${selectedRoom}/talkbacks`).limitToLast(30).on('value', (snap) => {
        const chatBox = document.getElementById('chatBox');
        if (!chatBox) return;

        const data = snap.val() || {};
        let html = '';

        const lastKey = Object.keys(data).pop();
        Object.keys(data).forEach(k => {
          const item = data[k];
          const isSelf = item.sender === currentUser.nickname;
          const bubbleClass = isSelf ? 'self' : 'other';
          const hhmm = item.timestamp ? new Date(item.timestamp).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
          html += `
            <div class="chat-bubble ${bubbleClass}${k === lastKey && !isSelf ? ' latest' : ''}">
              <div class="chat-sender">${isSelf ? 'คุณ' : item.sender}${hhmm ? ' · ' + hhmm : ''}</div>
              <div>${item.message}</div>
            </div>
          `;
        });

        chatBox.innerHTML = html;
        
        // 📌 บังคับ Scroll ลงมาล่างสุดที่แชตล่าสุดเสมอ (ใช้ setTimeout เพื่อรอให้ DOM Render เสร็จ 100%)
        setTimeout(() => {
          chatBox.scrollTop = chatBox.scrollHeight;
        }, 50);
      });
    }

    document.getElementById('tgToggle').onchange = function() { isTgEnabled = this.checked; };
    document.getElementById('btnSendTalkback').onclick = sendTalkback;
    document.getElementById('talkbackInput').onkeydown = function(e) { if (e.key === 'Enter') sendTalkback(); };

    document.getElementById('btnOpenFeel').onclick = () => document.getElementById('feelModal').classList.remove('hidden');
    document.getElementById('btnCancelFeel').onclick = () => document.getElementById('feelModal').classList.add('hidden');
    document.querySelectorAll('.btn-feel-item').forEach(item => {
      item.onclick = function() {
        if (isLandscapeQuick()) { landQuickTap(this, { action: this.getAttribute('data-act') }); return; }   // แนวนอน: แตะสองครั้งส่ง
        setInputValue(this.getAttribute('data-act'));
        document.getElementById('feelModal').classList.add('hidden');
      };
    });

    document.getElementById('btnOpenRequest').onclick = openRequestModal;
    document.getElementById('btnCloseRequestModal').onclick = closeRequestModal;
    document.getElementById('reqSearchInput').oninput = onReqSearchInput;
    document.getElementById('btnSendReqSong').onclick = sendReqFromModal;
    document.getElementById('btnApplyReqSong').onclick = applyReqSongToInput;

    // ผูกฟังก์ชัน closeRequestModal แบบ global เพื่อให้ HTML inline onclick ทำงานได้
    window.closeRequestModal = closeRequestModal;

    // ===== 2.0: แถบ Telegram ย่อเป็นลูกศร + ปุ่มฟีลพับได้ =====
    const tgBar = document.getElementById('tgBar');
    let tgStarted = false, tgOpenTimer = null;
    function tgSetCollapsed(c) { if (tgBar) tgBar.classList.toggle('tg-collapsed', !!c); }
    function tgRefreshState() {
      if (!tgBar) return;
      const t = document.getElementById('tgToggle');
      tgBar.setAttribute('data-tg', !(botToken && chatId) ? 'none' : (t && t.checked ? 'on' : 'off'));
    }
    function tgApplyStarted(started) {
      if (started === tgStarted) return;
      tgStarted = started;
      clearTimeout(tgOpenTimer);
      tgSetCollapsed(started);            // เริ่มโชว์ = ย่อเอง · ยังไม่เริ่ม/จบโชว์ = ขยาย
    }
    document.getElementById('tgTab').onclick = function() {
      tgSetCollapsed(false);
      clearTimeout(tgOpenTimer);
      if (tgStarted) tgOpenTimer = setTimeout(() => tgSetCollapsed(true), 5000);   // แตะลูกศร: ขยาย 5 วิ แล้วย่อเอง
    };
    document.getElementById('tgToggle').addEventListener('change', function() {
      tgRefreshState();
      if (tgStarted) { clearTimeout(tgOpenTimer); tgOpenTimer = setTimeout(() => tgSetCollapsed(true), 5000); }
    });
    if (typeof db !== 'undefined' && db.ref) {
      if (window.__tbRcRef && window.__tbRcCb) { try { window.__tbRcRef.off('value', window.__tbRcCb); } catch (e) {} }
      window.__tbRcRef = db.ref(`roomConfig/${selectedRoom}`);
      window.__tbRcCb = function() { setTimeout(tgRefreshState, 0); };
      window.__tbRcRef.on('value', window.__tbRcCb);
    }
    window.__tbTimerFn = function(st) { tgApplyStarted(!!(st && st.startedAt && !st.endedAt)); };
    if (window.lshShowTimer) {
      if (!window.__tbTimerBound) { window.__tbTimerBound = true; window.lshShowTimer.onChange(function(st, i) { if (window.__tbTimerFn) { try { window.__tbTimerFn(st, i); } catch (e) {} } }); }
      try { window.__tbTimerFn(window.lshShowTimer.state()); } catch (e) {}
    }
    tgRefreshState();

    const feelWrap = document.getElementById('feelWrap'), feelFoldBtn = document.getElementById('btnFeelFold');
    function feelSetFolded(f) { feelWrap.classList.toggle('folded', f); feelFoldBtn.setAttribute('aria-expanded', f ? 'false' : 'true'); }
    try { feelSetFolded(localStorage.getItem('lshTbFeelFolded') === '1'); } catch (e) {}
    feelFoldBtn.onclick = function() {
      const f = !feelWrap.classList.contains('folded');
      feelSetFolded(f);
      try { localStorage.setItem('lshTbFeelFolded', f ? '1' : '0'); } catch (e) {}
    };

    // ===== 2.0: แนวนอน 2 หน้า (คำสั่งด่วน / ฟีล-ตัดเพลง) =====
    document.querySelectorAll('.feel-chip').forEach(c => { const h = document.createElement('span'); h.className = 'q-hint'; h.textContent = 'แตะอีกครั้งเพื่อส่ง'; c.appendChild(h); });
    const tbMain = document.querySelector('.tb-main-content'), landTabs = document.getElementById('tbLandTabs');
    function landSetPage(p) {
      disarmQuick();
      tbMain.classList.toggle('land-feel', p === 'feel');
      landTabs.querySelectorAll('button').forEach(b => { const on = b.getAttribute('data-p') === p; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
    }
    landTabs.querySelectorAll('button').forEach(b => { b.onclick = () => landSetPage(b.getAttribute('data-p')); });
    let swX = 0, swY = 0, swOn = false;
    tbMain.addEventListener('touchstart', e => { if (e.touches.length !== 1) { swOn = false; return; } swOn = true; swX = e.touches[0].clientX; swY = e.touches[0].clientY; }, { passive: true });
    tbMain.addEventListener('touchend', e => {
      if (!swOn || !isLandscapeQuick()) return; swOn = false;
      const t = e.changedTouches[0], dx = t.clientX - swX, dy = t.clientY - swY;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;      // ต้องปัดแนวนอนชัดเจน ไม่งั้นนับเป็นแตะ
      landSetPage(dx < 0 ? 'feel' : 'quick');                                  // ปัดซ้าย = ไปฟีล · ปัดขวา = กลับคำสั่งด่วน
    }, { passive: true });
    tbMain.addEventListener('touchcancel', () => { swOn = false; }, { passive: true });

    initTelegramConfig();
    initQuickCommands();
    initDbSongs();
    listenRealtimeData();
  };
// ฟังก์ชันปิด Modal ตัดเพลง/เปลี่ยนฟีล (เช็กการแตะพื้นที่ภายนอก)
    function closeFeelModal(e) {
      if (!e || e.target.id === 'feelModal' || e.target.id === 'btnCancelFeel') {
        document.getElementById('feelModal').classList.add('hidden');
      }
    }

    // ผูก Event ปุ่มเปิด-ปิด Modal
    document.getElementById('btnOpenFeel').onclick = () => document.getElementById('feelModal').classList.remove('hidden');
    document.getElementById('btnCancelFeel').onclick = closeFeelModal;

    // ผูกฟังก์ชันไว้ที่ window เพื่อให้ HTML inline onclick เรียกใช้ได้
    window.closeFeelModal = closeFeelModal;
  window.initTalkbackPageModule();
</script>
