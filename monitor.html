<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stage Hub - Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="monitor-container">
    <!-- 1. ท็อคแบคล่าสุด -->
    <div class="monitor-top-section" id="monitorTopBar" onclick="openTalkbackHistoryModal()">
      <div class="monitor-top-header">
        <div class="mon-tb-label"><i class="mon-dot-red"></i><span>ท็อคแบค</span><span id="tbSender" class="mon-sep">- 🎵</span><span id="tbTime" class="mon-sep">-:--</span></div>
        <div class="mon-tb-ctl">
          <svg class="mon-spk" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
          <button type="button" id="tbSoundQuick" class="snd-switch" role="switch" aria-checked="false" aria-label="เปิดเสียงท็อคแบค" onclick="event.stopPropagation();toggleTbSound()"><span></span></button>
          <button type="button" id="tbSoundBtn" class="tb-sound-btn" aria-label="ตั้งค่าระดับเสียงและความเร็ว" onclick="openTbSoundPanel(event)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
        </div>
      </div>
      <div class="monitor-talkback-body">
        <div id="monitorTalkbackText" class="monitor-talkback-text">สแตนบายรอคำสั่ง...</div>
      </div>
    </div>

    <!-- 2. กำลังเล่น / ถัดไป / ตามด้วย -->
    <div class="monitor-songs-section" onclick="openFullQueueModal()">
      <div class="song-box-current">
        <i class="mon-dot-green mon-eq" aria-hidden="true"><u></u><u></u><u></u><u></u></i>
        <span class="box-label">กำลังเล่น</span>
        <div id="mPlayingTitle" class="box-title-playing">-</div>
      </div>

      <div class="song-box-next" id="nextSongCardBox">
        <div class="mon-next-head"><span class="mon-badge">ถัดไป</span><span id="mNextSet" class="mon-set"></span></div>
        <div id="mNextTitle" class="box-title-next">-</div>
        <div id="mNextDetail" class="box-detail-next">-</div>
        <div class="mon-tiles" id="mNextTiles">
          <div class="mon-tile"><div>KEY</div><b id="mNextKey">-</b></div>
          <div class="mon-tile"><div>BPM</div><b id="mNextBpm">-</b></div>
        </div>
        <div class="mon-note" id="mNextNoteRow"><span>โน้ต</span> <span id="mNextNote"></span></div>
        <div id="mNextMed" class="mon-medlist" onclick="event.stopPropagation()"></div>
      </div>

      <div class="song-box-standby" id="standbyBox">
        <div class="mon-sb-head"><span id="mStandbyLabel">ตามด้วย</span><span id="mStandbyKb" class="mon-kb"></span></div>
        <div id="mStandbyTitle" class="box-title-standby">-</div>
        <div id="mStandbyArtist" class="mon-sb-artist"></div>
      </div>
    </div>

    <!-- 3. ความคืบหน้าโชว์ (แถบบางชิดล่าง แตะเพื่อเปิดคิวเต็ม) -->
    <div class="monitor-progress-bar-container" onclick="openFullQueueModal()">
      <div class="progress-caption" style="display:flex;justify-content:space-between;font-size:9px;color:#888">
        <span>สถานะความคืบหน้าโชว์</span>
        <span id="progressText">Set 1 (0/0)</span>
      </div>
      <div class="progress-segments" id="progressSegmentsContainer"></div>
    </div>
  </div>

  <!-- หน้าคาราโอเกะ (แนวนอน แตะการ์ดกำลังเล่น) -->
  <div id="karView" class="kar hidden" role="dialog" aria-label="คาราโอเกะ">
    <div class="kar-top">
      <div class="kar-l"><div id="karTitle" class="kar-title"></div><div id="karSec" class="kar-sec"></div></div>
      <button type="button" id="karExit" class="kar-exit" aria-label="ออกจากหน้าคาราโอเกะ"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button>
      <div class="kar-spd"><span>ความเร็ว</span><button type="button" id="karSpM" aria-label="ช้าลง">−</button><b id="karSpV">x1.0</b><button type="button" id="karSpP" aria-label="เร็วขึ้น">+</button></div>
    </div>
    <div id="karSegs" class="kar-segs hidden" aria-label="ท่อนของเพลง"></div>
    <div id="karMain" class="kar-main">
      <div id="karCur" class="kar-line cur"></div>
      <div id="karNxt" class="kar-line nxt"></div>
      <div id="karN2" class="kar-line nxt nxt2" style="display:none"></div>
      <div id="karN3" class="kar-line nxt nxt3" style="display:none"></div>
      <div id="karWheel" class="kw-wrap" aria-hidden="true"></div>
      <div id="karMsg" class="kar-msg"></div>
      <div class="kar-steps"><button type="button" id="karUp" class="kar-step" aria-label="บรรทัดก่อนหน้า"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button><button type="button" id="karDn" class="kar-step" aria-label="บรรทัดถัดไป"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button></div>
      <div id="karPause" class="kar-pause hidden">⏸ หยุดชั่วคราว · แตะเพื่อเล่นต่อ</div>
    </div>
    <div class="kar-bot" id="karBot">
      <div class="kar-tb"><i></i><div class="kar-tbc"><small id="karTbMeta">ท็อคแบค</small><div id="karTbText">สแตนบายรอคำสั่ง...</div></div></div>
      <div id="karNx" class="kar-nx"><em id="karNxSet">ถัดไป</em><b id="karNxTitle">-</b><span id="karNxKey"></span></div>
    </div>
  </div>

  <!-- Modals -->
  <!-- ตั้งค่าเสียงท็อคแบค -->
  <div id="tbSoundPanel" class="slide-modal-overlay hidden" onclick="closeTbSoundPanel(event)">
    <div class="popup-dialog" onclick="event.stopPropagation()">
      <div class="modal-head"><div class="modal-title"><svg class="ic" aria-hidden="true"><use href="#i-volume"/></svg> เสียงท็อคแบค</div></div>
      <div class="snd-row">
        <div class="snd-row-text"><b>เสียงท็อคแบค</b><span id="tbSoundState">ปิดอยู่</span></div>
        <button type="button" id="tbSoundToggle" class="snd-switch" role="switch" aria-checked="false" aria-label="เปิด/ปิดเสียงท็อคแบค" onclick="toggleTbSound()"><span></span></button>
      </div>
      <label class="tb-slide"><span>ความดัง (Master) <b id="tbVolVal">100%</b></span><input type="range" id="tbVolRange" min="0" max="100" step="5" value="100"></label>
      <label class="tb-slide"><span>ความเร็วในการอ่าน <b id="tbRateVal">1.0x</b></span><input type="range" id="tbRateRange" min="0.6" max="1.6" step="0.1" value="1"></label>
      <div id="tbSoundNote" class="tb-sound-note"></div>
      <button type="button" class="popup-btn popup-btn-move" onclick="testTbSound()">ลองฟังเสียง</button>
      <button type="button" class="popup-btn popup-btn-cancel" onclick="closeTbSoundPanel()">ปิด</button>
    </div>
  </div>

  <div id="talkbackHistoryModal" class="slide-modal-overlay hidden" onclick="closeTalkbackHistoryModal(event)">
    <div class="slide-down-content" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:6px">
        <span style="font-size:14px;font-weight:bold;color:#00f2d1"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg> ประวัติ 4 คำสั่งท็อคแบคล่าสุด</span>
        <button onclick="closeTalkbackHistoryModal()" style="background:none;border:none;color:#aaa;font-size:16px;cursor:pointer"><svg class="ic ic-solo" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
      <div id="talkbackHistoryList" class="u-col-6"></div>
    </div>
  </div>

  <div id="fullQueueModal" class="slide-modal-overlay hidden" onclick="closeFullQueueModal(event)">
    <div class="slide-up-content" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:6px">
        <span style="font-size:15px;font-weight:bold;color:#00f2d1"><svg class="ic" aria-hidden="true"><use href="#i-music"/></svg> รายการคิวเพลงทั้งหมด</span>
        <button onclick="closeFullQueueModal()" style="background:none;border:none;color:#aaa;font-size:18px;cursor:pointer"><svg class="ic ic-solo" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
      <div id="fullQueueListContainer" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0"></div>
    </div>
  </div>

  <script>
    window.initMonitorPageModule = function() {
      let currentQueue = [];
      let lastNextSongId = null;
      let lastBrkPlayId;   // พักคุยที่กำลังเล่นรอบก่อน (undefined = ยังไม่เคยประมวลผล ไม่กะพริบตอนเปิดหน้า)
      let lastMedPlayId;   // เมดเลย์ที่กำลังเล่นรอบก่อน (undefined = ยังไม่เคยประมวลผล ไม่กะพริบตอนเปิดหน้า)

      const sessionStr = localStorage.getItem('lsh_session');
      const session = sessionStr ? JSON.parse(sessionStr) : {};
      const selectedRoom = lshRoom(session);
        if (!selectedRoom) return; // ไม่พบห้อง: ไม่เขียน/อ่านข้อมูลใดๆ และกลับไปหน้าเลือกห้อง

      // ไม่ใส่สีเซ็ตให้การ์ด "เตรียมพร้อม/จบการแสดง"
      function colorOf(s) { return (s.type === 'dummy_start' || s.type === 'dummy_end') ? '' : getSetColorClass(s.set); }
      // บรรทัดเดียว: ชื่อเพลง - ศิลปิน (คีย์: X) — ซ่อนส่วนที่ว่าง
      function songLine(s) {
        let t = (s.type === 'dummy_start' || s.type === 'dummy_end') ? lshPlain(s.title) : (s.title || '');
        if (s.artist) t += ` - ${s.artist}`;
        if (s.key && s.key !== '-') t += ` (คีย์: ${s.key})`;
        return t;
      }
      function getSetColorClass(setVal) {
        let num = (setVal || 'Set 1').replace('Set ', '').trim();
        return `color-set-${num}`;
      }

      function initMonitorQueueListener() {
        if (typeof db !== 'undefined' && db && db.ref) {
          db.ref(`rooms/${selectedRoom}/queue/songs`).off('value');
          // 🕐 หน่วง 1 วินาที: คิวที่เปลี่ยนรัวๆ (กำลังจัด/ลากสลับ) จะแสดงเฉพาะผลสุดท้าย — ครั้งแรกที่เปิดหน้าแสดงทันที, รอสูงสุด 3 วินาทีแล้วแสดงเลย
          let settleTimer = null, settleSince = 0, firstQueue = true;
          const showQueue = (val) => {
            if (val && Array.isArray(val)) {
              processQueueData(val);
            } else {
              let localQueue = JSON.parse(localStorage.getItem('lsh_queue_data')) || [];
              processQueueData(localQueue);
            }
          };
          db.ref(`rooms/${selectedRoom}/queue/songs`).on('value', (snapshot) => {
            const val = snapshot.val();
            if (firstQueue) { firstQueue = false; showQueue(val); return; }
            if (!settleSince) settleSince = Date.now();
            clearTimeout(settleTimer);
            const wait = Math.max(0, Math.min(1000, 3000 - (Date.now() - settleSince)));
            settleTimer = setTimeout(() => { settleSince = 0; settleTimer = null; showQueue(val); }, wait);
          });
        } else {
          let localQueue = JSON.parse(localStorage.getItem('lsh_queue_data')) || [];
          processQueueData(localQueue);
        }
      }

      // เลื่อนข้อความ 3 กล่องแบบน้ำตก: ไปเพลงถัดไป = เลื่อนขึ้น, ย้อนกลับ = เลื่อนลง (ไม่เล่นตอนโหลดครั้งแรก)
      let lastSlideSig = null;
      let lastSlideIdx = -1;
      function slideSongBoxes(queueData) {
        const idOf = (i) => i ? String(i.id || i.title) : '';
        const playing = queueData.find(i => i.status === 'playing');
        const next = queueData.find(i => i.status === 'next');
        const standby = queueData.find(i => i.status === 'standby');
        const sig = idOf(playing) + '|' + idOf(next) + '|' + idOf(standby);
        const anchor = playing || next || standby;
        const idx = anchor ? queueData.indexOf(anchor) : -1;
        const changed = lastSlideSig !== null && sig !== lastSlideSig;
        const dir = idx < lastSlideIdx ? 'slide-back' : 'slide-fwd';
        lastSlideSig = sig;
        lastSlideIdx = idx;
        if (!changed) return;
        const groups = [
          ['mPlayingTitle'],
          ['mNextTitle', 'mNextDetail'],
          ['mStandbyTitle']
        ];
        groups.forEach((ids, g) => {
          ids.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.remove('slide-fwd', 'slide-back');
            void el.offsetWidth;
            el.style.setProperty('--slide-delay', (g * 90) + 'ms');
            el.classList.add(dir);
            el.addEventListener('animationend', () => el.classList.remove('slide-fwd', 'slide-back'), { once: true });
          });
        });
      }

      // สีกรอบเพลงถัดไป = สีเซ็ตของเพลงนั้น (รีเควส/แทรกใช้สีของตัวเอง)
      function nxColor(x) {
        if (x.type === 'inserted-request') return 'var(--request)';
        if (x.type === 'inserted-custom') return 'var(--custom)';
        return 'var(--set-' + (String(x.set || 'Set 1').replace(/\D/g, '') || '1') + ', var(--set-1))';
      }

      // แนวนอน: ชื่อเพลง/ศิลปินบรรทัดเดียว ถ้าแสดงไม่หมดให้วิ่งจากขวามาซ้าย (แสดงหมดแล้วอยู่นิ่ง) — แนวตั้งคงเดิม (ขึ้นบรรทัดใหม่)
      const MQ_LAND = '(orientation: landscape) and (max-height: 640px)';
      function fitMarquee(el, maxLines) {
        if (!el) return;
        const text = el.dataset.full !== undefined ? el.dataset.full : el.textContent;
        el.textContent = text;
        el.classList.remove('mq-host', 'mq-wrap');
        if (!window.matchMedia(MQ_LAND).matches || !text) return;
        if (maxLines > 1) {
          // ชื่อเพลง: ตัวใหญ่พอดี ขึ้นบรรทัดใหม่ได้ไม่เกิน maxLines บรรทัด · ยาวกว่านั้นจริงๆ ค่อยเป็นตัววิ่งบรรทัดเดียว
          el.classList.add('mq-wrap');
          const lh = parseFloat(getComputedStyle(el).lineHeight) || (el.clientHeight / maxLines);
          const cs = getComputedStyle(el), pad = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
          if (el.scrollHeight - pad <= lh * maxLines + 2) return;
          el.classList.remove('mq-wrap');
        }
        el.classList.add('mq-host');
        if (el.scrollWidth > el.clientWidth + 1) {
          const sp = document.createElement('span');
          sp.className = 'mq';
          sp.textContent = text;
          el.textContent = '';
          el.appendChild(sp);
          el.style.setProperty('--mq-dur', Math.max(6, (el.clientWidth + sp.scrollWidth) / 110) + 's');
        }
      }
      function refitNextMarquee() { fitMarquee(document.getElementById('mNextTitle'), 2); fitMarquee(document.getElementById('mNextDetail'), 1); }
      if (!window.__mqBound) { window.__mqBound = true; window.addEventListener('resize', () => { if (document.getElementById('mNextTitle')) refitNextMarquee(); }); }

      function processQueueData(queueData) {
        window.lshReady && window.lshReady();
        currentQueue = queueData;
        if (!document.getElementById('mPlayingTitle')) return; // ออกจากหน้ามอนิเตอร์แล้ว (ตัวฟังยังค้างอยู่) — ไม่ต้องวาด

        let playing = queueData.find(i => i.status === 'playing');
        let next = queueData.find(i => i.status === 'next');
        let standby = queueData.find(i => i.status === 'standby');

        let currentNextId = next ? (next.id || next.title) : null;
        if (currentNextId !== lastNextSongId) {
          if (lastNextSongId !== null) {
            triggerNextSongFlashAlert();
          }
          lastNextSongId = currentNextId;
        }

        // เมดเลย์ (รายการในคิวที่มี parts): ถัดไป = ชื่อเมดเลย์+ชื่อเพลง / กำลังเล่น = กล่องใหญ่แสดงรายการเพลง-คีย์-ท่อน, เพลงถัดไปจริงย้ายลงกล่องตามด้วย
        const isMed = (x) => !!x && Array.isArray(x.parts) && x.parts.length > 0;
        const medPlay = isMed(playing);
        {
          const mid = medPlay ? String(playing.id) : null;
          if (lastMedPlayId !== undefined && mid && mid !== lastMedPlayId) triggerNextSongFlashAlert();   // กะพริบกล่องใหญ่ 1 ครั้งตอนเมดเลย์เริ่มเล่น
          lastMedPlayId = mid;
        }
        {
          const bid = playing && playing.type === 'break' ? String(playing.id) : null;
          if (lastBrkPlayId !== undefined && bid && bid !== lastBrkPlayId) triggerNextSongFlashAlert();   // กะพริบ 1 ครั้งตอนเริ่มพักคุย
          lastBrkPlayId = bid;
        }
        const mPlayingTitle = document.getElementById('mPlayingTitle');
        const isSpecial = (x) => !!x && (x.type === 'dummy_start' || x.type === 'dummy_end');
        const isBrk = (x) => !!x && x.type === 'break';   // พักคุย: ใช้สีของเซ็ต ไม่แสดงศิลปิน/คีย์/BPM
        const plainTitle = (x) => isBrk(x) ? 'พักคุย' : isSpecial(x) ? lshPlain(x.title) : (x.title || '');
        const setLabel = (x) => (!x || isSpecial(x) || isBrk(x)) ? '' : String(x.set || 'Set 1').toUpperCase();
        const setNum = (x) => String((x && x.set) || 'Set 1').replace(/\D/g, '') || '1';
        if (playing) {
          mPlayingTitle.className = 'box-title-playing';
          mPlayingTitle.innerText = plainTitle(playing);
          const pb = document.querySelector('.song-box-current');
          if (pb) pb.style.setProperty('--bar', isSpecial(playing) ? 'var(--line-strong)' : 'var(--set-' + setNum(playing) + ', var(--set-1))');
        } else {
          mPlayingTitle.className = 'box-title-playing';
          mPlayingTitle.innerText = '-';
        }

        const nextBox = document.getElementById('nextSongCardBox');
        if (nextBox) nextBox.style.setProperty('--nx', !next || isSpecial(next) ? 'var(--line-strong)' : nxColor(next));
        const mNextTitle = document.getElementById('mNextTitle');
        const nextSetEl = document.getElementById('mNextSet');
        const tilesEl = document.getElementById('mNextTiles');
        const noteRow = document.getElementById('mNextNoteRow');
        const medBox = document.getElementById('mNextMed'), nbadge = nextBox && nextBox.querySelector('.mon-badge');
        if (nextBox) nextBox.classList.toggle('is-medlist', medPlay);
        if (nbadge) nbadge.textContent = medPlay ? 'เมดเลย์' : 'ถัดไป';
        if (medPlay) {
          const tbEl = document.getElementById('monitorTalkbackText');
          const fsz = tbEl ? getComputedStyle(tbEl).fontSize : '';
          const esc2 = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
          const sig = JSON.stringify([playing.id, playing.parts, fsz]);
          if (medBox.dataset.sig !== sig) {
            const keepTop = medBox.scrollTop;
            medBox.dataset.sig = sig;
            medBox.style.fontSize = fsz || '';
            medBox.innerHTML = playing.parts.map((pt, k) => '<div class="mm-song"><span class="mm-no">' + (k + 1) + '.</span> <b>' + esc2(pt.title) + '</b> <span class="mm-key">– ' + esc2(pt.key || '-') + '</span></div><div class="mm-secs">' + esc2((pt.secs || []).map(x => x.n).join(' › ')) + '</div>').join('');
            medBox.scrollTop = keepTop;
          }
          if (nextSetEl) nextSetEl.textContent = setLabel(playing);
          nextBox.style.setProperty('--nx', nxColor(playing));
        } else if (medBox) { medBox.dataset.sig = ''; }
        if (medPlay) {
          // ไม่แตะ mNextTitle/mNextDetail (ซ่อนด้วย CSS) ปล่อยค่าเดิมไว้
        } else if (next) {
          mNextTitle.className = 'box-title-next';
          mNextTitle.textContent = plainTitle(next);
          const special = isSpecial(next) || isMed(next) || isBrk(next);
          document.getElementById('mNextDetail').innerText = (isSpecial(next) || isBrk(next)) ? '' : (isMed(next) ? next.parts.map(pt => pt.title).join(' · ') : (next.artist || ''));
          if (nextSetEl) nextSetEl.textContent = setLabel(next);
          if (tilesEl) tilesEl.style.display = special ? 'none' : '';

      function initMonitorTalkbackListener() {
        if (typeof db !== 'undefined' && db && db.ref) {
          // ปลดตัวฟังเก่าก่อนเสมอ (กันตัวฟังซ้อนเมื่อเข้าหน้านี้ซ้ำ ซึ่งทำให้พูดซ้ำ/กระพริบซ้ำ)
          if (window.__monTbRef && window.__monTbCb) { try { window.__monTbRef.off('value', window.__monTbCb); } catch (e) {} }
          window.__tbSeenKeys = window.__tbSeenKeys || new Set();
          let first = true;
          const ref = db.ref(`rooms/${selectedRoom}/talkbacks`).limitToLast(4);
          const cb = (snapshot) => {
            if (!document.getElementById('monitorTalkbackText')) return; // ออกจากหน้ามอนิเตอร์แล้ว
            const val = snapshot.val() || {};
            const keys = Object.keys(val);
            let list = keys.map(k => val[k]).reverse();

            // ข้อความใหม่จริง = key ที่ยังไม่เคยเห็น (โหลดครั้งแรกถือว่าเห็นหมดแล้ว ไม่อ่านย้อนหลัง)
            const newKeys = first ? [] : keys.filter(k => !window.__tbSeenKeys.has(k));
            keys.forEach(k => window.__tbSeenKeys.add(k));
            first = false;

            if (list.length > 0) {
              let latest = list[0];
              let timeStr = new Date(latest.timestamp || Date.now()).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });

              document.getElementById('tbTime').innerText = timeStr;
              document.getElementById('tbSender').innerText = `${latest.sender || 'ระบบ'} ${latest.emoji || '🎵'}`;
              setTalkbackText(latest.message || '');

              // กระพริบ/เลื่อนเข้า 1 ครั้ง และเข้าคิวเสียงพูดทีละข้อความตามลำดับที่ส่งมา
              if (newKeys.length > 0) {
                triggerTalkbackFlashAlert();
                slideInTalkback();
                newKeys.forEach(k => announceTalkback((val[k] && val[k].message) || ''));
              }
              renderTalkbackHistory(list);
            }
          };
          ref.on('value', cb);
          window.__monTbRef = ref; window.__monTbCb = cb;
        }

      // แสดงข้อความท็อคแบค: วิ่งเฉพาะเมื่อยาวเกินกล่อง ถ้าพอดีจอให้แสดงนิ่ง
      function setTalkbackText(text) {
        const el = document.getElementById('monitorTalkbackText');
        if (!el) return;
        el.textContent = text;
        fitTalkbackText();
      }
      function fitTalkbackText() {
        const el = document.getElementById('monitorTalkbackText');
        const box = el && el.parentElement;
        if (!el || !box) return;
        el.classList.remove('tb-run');
        el.style.removeProperty('--tb-start'); el.style.removeProperty('--tb-end'); el.style.removeProperty('--tb-dur');
        requestAnimationFrame(() => {
          const w = el.scrollWidth, bw = box.clientWidth;
          if (bw > 0 && w > bw) {
            const dist = bw + w;
            el.style.setProperty('--tb-start', bw + 'px');
            el.style.setProperty('--tb-end', '-' + w + 'px');
            el.style.setProperty('--tb-dur', Math.max(6, dist / 110).toFixed(1) + 's');

      function slideInTalkback() {

      // ===== เสียงท็อคแบค: ปี๊บสั้นๆ แล้วอ่านเฉพาะข้อความ =====
      const TB_SND_KEY = 'lsh_tb_sound';
      const tbSnd = { on: false, vol: 1, rate: 1 };
      try { Object.assign(tbSnd, JSON.parse(localStorage.getItem(TB_SND_KEY)) || {}); } catch (e) {}
      let tbAudioCtx = null;
      let tbThaiVoice = null;
      function saveTbSnd() { try { localStorage.setItem(TB_SND_KEY, JSON.stringify(tbSnd)); } catch (e) {} }
      function pickThaiVoice() {
        if (!('speechSynthesis' in window)) return;
        tbThaiVoice = speechSynthesis.getVoices().find(v => /^th/i.test(v.lang)) || null;
        updateTbSoundUi();
      }
      if ('speechSynthesis' in window) { pickThaiVoice(); speechSynthesis.onvoiceschanged = pickThaiVoice; }
      function tbBeep(done) {
        try {
          tbAudioCtx = tbAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (tbAudioCtx.state === 'suspended') tbAudioCtx.resume();
          const t = tbAudioCtx.currentTime;
          const osc = tbAudioCtx.createOscillator(), g = tbAudioCtx.createGain();
          osc.type = 'sine'; osc.frequency.value = 988;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(Math.max(0.0002, 0.5 * tbSnd.vol), t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
          osc.connect(g); g.connect(tbAudioCtx.destination);
          osc.start(t); osc.stop(t + 0.22);
          setTimeout(done, 260);
        } catch (e) { done(); }
      }
      // พูดข้อความ 1 รอบ แล้วเรียก done เมื่อจบ (มีตัวจับเวลาสำรองเผื่อเบราว์เซอร์ไม่ส่งสัญญาณจบ)
      function tbSpeak(text, done) {
        let finished = false;
        const finish = () => { if (finished) return; finished = true; clearTimeout(guard); if (done) done(); };
        const clean = String(text).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, ' ').replace(/\s+/g, ' ').trim();
        const guard = setTimeout(finish, 5000 + clean.length * 260);
        if (!('speechSynthesis' in window) || !clean) { finish(); return; }
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = 'th-TH';
        if (tbThaiVoice) u.voice = tbThaiVoice;
        u.volume = tbSnd.vol; u.rate = tbSnd.rate;
        u.onend = finish; u.onerror = finish;
        try { speechSynthesis.speak(u); } catch (e) { finish(); }
      }
      // คิวเสียง: ข้อความแรกอ่านจบก่อน แล้วค่อยปี๊บ + อ่านข้อความถัดไป (รอไม่เกิน 5 ข้อความ)
      window.__tbSpeechQ = window.__tbSpeechQ || { items: [], busy: false };
      function runTbQueue() {
        const q = window.__tbSpeechQ;
        if (q.busy) return;
        const t = q.items.shift();
        if (t === undefined) return;
        q.busy = true;
        tbBeep(() => tbSpeak(t, () => { q.busy = false; setTimeout(runTbQueue, 350); }));
      }
      function announceTalkback(text) {
        if (!tbSnd.on) return;
        const q = window.__tbSpeechQ;
        q.items.push(text);
        while (q.items.length > 5) q.items.shift();
        runTbQueue();
      }
      function updateTbSoundUi() {
        const btn = document.getElementById('tbSoundBtn');
        const quick = document.getElementById('tbSoundQuick');
        if (quick) quick.setAttribute('aria-checked', tbSnd.on ? 'true' : 'false');

        if (tg) { tg.setAttribute('aria-checked', tbSnd.on ? 'true' : 'false'); const st = document.getElementById('tbSoundState'); if (st) st.textContent = tbSnd.on ? 'เปิดอยู่' : 'ปิดอยู่'; }
        const vr = document.getElementById('tbVolRange'), rr = document.getElementById('tbRateRange');
        if (vr) { vr.value = Math.round(tbSnd.vol * 100); document.getElementById('tbVolVal').textContent = vr.value + '%'; }
        if (rr) { rr.value = tbSnd.rate; document.getElementById('tbRateVal').textContent = Number(tbSnd.rate).toFixed(1) + 'x'; }
        const note = document.getElementById('tbSoundNote');
        if (note) note.textContent = !('speechSynthesis' in window) ? 'เบราว์เซอร์นี้ไม่รองรับเสียงอ่าน (จะมีแค่เสียงปี๊บ)'
          : (tbThaiVoice ? '' : 'เครื่องนี้อาจไม่มีเสียงอ่านภาษาไทย (จะลองใช้เสียงเริ่มต้นของเครื่อง)');
      }
      function openTbSoundPanel(e) { if (e) e.stopPropagation(); updateTbSoundUi(); document.getElementById('tbSoundPanel').classList.remove('hidden'); }
      function closeTbSoundPanel(e) { if (!e || e.target.id === 'tbSoundPanel') document.getElementById('tbSoundPanel').classList.add('hidden'); }
      function toggleTbSound() {
        tbSnd.on = !tbSnd.on; saveTbSnd(); updateTbSoundUi();
        if (tbSnd.on) { testTbSound(); } // การแตะครั้งนี้ปลดล็อกเสียงของเบราว์เซอร์
      }
      function testTbSound() { tbBeep(() => tbSpeak('ทดสอบเสียงท็อคแบค')); }

      document.getElementById('tbRateRange').addEventListener('input', (e) => { tbSnd.rate = parseFloat(e.target.value); saveTbSnd(); updateTbSoundUi(); });
      updateTbSoundUi();
      Object.assign(window, { openTbSoundPanel, closeTbSoundPanel, toggleTbSound, testTbSound });

      // ฟังก์ชันกระพริบเตือนเมื่อเพลงถัดไปเปลี่ยน (แก้ให้ใช้ setTimeout หน่วงเวลาแทน)
      function triggerNextSongFlashAlert() {

      // ===== แตะการ์ด "กำลังเล่น": แนวตั้ง → หน้าค้นหาคอร์ด (ขยายเพลงนี้) / แนวนอน → คาราโอเกะ =====
      const hasChordsOf = (x) => !!(x && (Array.isArray(x.parts) && x.parts.length > 0 || x.songId && ((window.lshChordMarks && window.lshChordMarks.has(String(x.songId))) || (window.lshChordOwn && window.lshChordOwn.has(String(x.songId))))));
      const NO_CHORD_TXT = 'เพลงนี้ยังไม่มีคอร์ดในฐานข้อมูล';
      const kar = { on: false, qid: null, key: '', doc: null, lines: [], N: 0, dur: 240, speed: 1, p0: 0, t0: 0, drag: null, shown: -1, tok: 0, timer: 0, tbSig: '', paused: false, hold: false, wp: 0, v: 0, raf: 0, settle: null, rows: [], rowsFor: null, wl: null, lastTb: null, lastNx: null };
      const $k = (id) => document.getElementById(id);
      const kEsc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const kReal = (x) => !!x && x.type !== 'dummy_start' && x.type !== 'dummy_end' && x.type !== 'break';
      const kClamp = (v, a, b) => Math.max(a, Math.min(b, v));

      function karPos(now) { return kar.N ? (kar.paused ? kClamp(kar.p0, 0, kar.N - 1) : kClamp(kar.p0 + (now - kar.t0) / 1000 * kar.speed * kar.N / kar.dur, 0, kar.N - 1)) : 0; }
      function karMsg(t) { karWheelExit(); kar.rowsFor = null; kar.lines = []; kar.N = 0; kar.doc = null; kar.shown = -1; kar.secs = null; kar.secsFor = null; $k('karSegs').classList.add('hidden'); $k('karCur').innerHTML = ''; $k('karNxt').innerHTML = ''; $k('karN2').innerHTML = ''; $k('karN3').innerHTML = ''; $k('karSec').textContent = ''; $k('karMsg').textContent = t || ''; }
      function karSegs(line) { return line.segs.map(g => '<span class="seg' + (g.bar ? ' bar' : '') + '"><b>' + (g.c ? kEsc(g.c) : '&nbsp;') + '</b><span>' + kEsc(g.t || ' ') + '</span></span>').join(''); }
      // ย่อตัวอักษรให้พอดีหนึ่งบรรทัด (ย่อได้ถึง 60%) ถ้ายังไม่พอค่อยขึ้นบรรทัดใหม่
      // ขนาดตัวอักษรเนื้อเพลงตั้งต้น: แนวนอนอิงความสูงจอ แนวตั้งอิงความกว้างจอ
      function karBase() { const w = window.innerWidth, h = window.innerHeight; return w > h ? kClamp(Math.round(h * 0.115), 26, 54) : kClamp(Math.round(w * 0.075), 26, 64); }
      function karFit(el, px) {
        el.classList.remove('wrap'); el.style.fontSize = px + 'px';
        const cw = el.clientWidth; if (!cw) return;
        let f = px;
        for (let k = 0; k < 4 && el.scrollWidth > cw && f > px * 0.6; k++) {
          f = Math.max(px * 0.6, f * cw / el.scrollWidth * 0.97); el.style.fontSize = f + 'px';
        }
        if (el.scrollWidth > cw) el.classList.add('wrap');
      }
      // ===== ท่อนของเพลง (Intro/Verse/Hook ...): สร้างจากข้อมูลคอร์ด 1 ท่อน = 1 ช่องในแถบ =====
